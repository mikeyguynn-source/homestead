anizations"},{"tag":"p","t":"- Designing interventions that address social determinants of distress"},{"tag":"p","t":"- Training community mental health workers"},{"tag":"p","t":"- Developing affordable and scalable treatment approaches"},{"tag":"p","t":"- Open-access education and public psychological literacy"},{"tag":"p","t":"- Working with nonprofits, governments, and grassroots organizations"},{"tag":"h3","t":"6.6 Building a Nonprofit and Expanding Its Impact"},{"tag":"p","t":"- Developing a mission and theory of change"},{"tag":"p","t":"- Establishing a nonprofit organization"},{"tag":"p","t":"- Building a sustainable funding model"},{"tag":"p","t":"- Philanthropy, grants, and public partnerships"},{"tag":"p","t":"- Starting with a small outpatient clinical program"},{"tag":"p","t":"- Expanding into integrative community treatment"},{"tag":"p","t":"- Establishing a retreat center and ecological campus"},{"tag":"p","t":"- Developing research partnerships with universities"},{"tag":"p","t":"- Creating standardized clinical protocols"},{"tag":"p","t":"- Measuring outcomes and cost-effectiveness"},{"tag":"p","t":"- Replicating successful models in underserved settings"},{"tag":"p","t":"- Maintaining accessibility without sacrificing clinical quality"},{"tag":"p","t":"- Preventing mission drift and dependence on wealthy clientele"},{"tag":"h3","t":"6.7 Applying the Framework to My Own Life"},{"tag":"p","t":"- Defining personal happiness and fulfillment"},{"tag":"p","t":"- Developing a sustainable contemplative practice"},{"tag":"p","t":"- Creating a lifestyle consistent with psychological research"},{"tag":"p","t":"- Reducing consumerism and unnecessary dependency"},{"tag":"p","t":"- Building financial independence"},{"tag":"p","t":"- Developing meaningful relationships and community"},{"tag":"p","t":"- Finding an ideal place to live"},{"tag":"p","t":"- Building or joining a sustainable living community"},{"tag":"p","t":"- Integrating meaningful work, service, and leisure"},{"tag":"p","t":"- Avoiding burnout and the pursuit of endless productivity"},{"tag":"p","t":"- Cultivating psychological freedom while living within imperfect systems"},{"tag":"p","t":"- Finding peace without abandoning the desire for social change"},{"tag":"h3","t":"6.8 The Long-Term Vision: A Model for Human Flourishing"},{"tag":"p","t":"- A replicable integrative mental healthcare system"},{"tag":"p","t":"- Affordable and accessible treatment"},{"tag":"p","t":"- Integration of neuroscience, psychotherapy, and contemplative practice"},{"tag":"p","t":"- Ecologically sustainable treatment environments"},{"tag":"p","t":"- Community-centered living and mutual support"},{"tag":"p","t":"- Reduced dependency on exploitative economic structures"},{"tag":"p","t":"- Research-informed improvements in quality of life"},{"tag":"p","t":"- Empowering individuals to develop autonomy and resilience"},{"tag":"p","t":"- Creating institutions that prioritize well-being over profit"},{"tag":"p","t":"- Demonstrating how alternative models of healthcare and community can function in practice"},{"tag":"h2","t":"Ongoing learning library"},{"tag":"p","t":"Bruce D. Perry — Neurosequential Model of Therapeutics (NMT)"},{"tag":"p","t":"NMT is a developmentally sensitive, neurobiology-informed framework for clinical assessment and treatment planning, not a standalone psychotherapy. It organizes developmental history, stress and trauma exposure, relational experiences, strengths, and current functioning to help clinicians choose and sequence appropriate interventions."},{"tag":"p","t":"Clinical principle: Regulate → Relate → Reason. When a person is highly dysregulated, prioritize physiological and sensory regulation; then supportive, attuned relationships; then reflection, learning, and cognitively demanding therapies as capacity permits. This is a useful clinical heuristic, not a literal claim that separate brain regions operate in isolation."},{"tag":"p","t":"Applications to an integrative treatment framework: (1) assess developmental adversity, arousal patterns, attachment, and functional capacities; (2) select individualized regulation supports such as predictable routines, movement, rhythm, and sleep support; (3) build relational safety and co-regulation; (4) introduce cognitive, trauma-focused, existential, and contemplative interventions at an appropriate pace; (5) monitor functional outcomes and adapt sequencing. Potential connections to neuromodulation and mindfulness are hypotheses to evaluate, not established NMT treatment protocols."},{"tag":"p","t":"Evidence caution: NMT's underlying neurodevelopmental concepts and clinical rationale should be distinguished from evidence that the full NMT assessment and sequencing approach outperforms alternatives; the model is not a diagnostic brain scan."},{"tag":"p","t":"Original model and resources: https://www.neurosequential.com/nmt"},{"tag":"p","t":"Bruce Perry overview: https://www.bdperry.com/clincal-work"},{"tag":"p","t":"Published chapter: https://psychiatryonline.org/doi/10.1176/appi.books.9781585625291.lg02"},{"tag":"p","t":"Illustrated Regulate–Relate–Reason model (source PDF, see diagram): https://www.reed.edu/title-ix/Trauma-Informed-Foundations-Slide-Deck.pdf"},{"tag":"p","t":"Stanford SAINT protocol — accelerated TMS research"},{"tag":"p","t":"SAINT uses individualized functional MRI targeting and an intensive course of intermittent theta-burst stimulation, usually ten sessions a day for five days. It targets a left prefrontal location selected for its connectivity with the subgenual cingulate."},{"tag":"p","t":"In a 2026 randomized trial, remission one month after treatment occurred in 50 percent of the active group and 20.8 percent of the sham group. An earlier trial reported 79 percent remission at some point during four weeks of follow-up versus 13 percent with sham, a different endpoint. A 2025 follow-up suggested that maintaining remission over twelve weeks remains challenging."},{"tag":"p","t":"Integrative framework question: Could rapid neuromodulation combined with psychotherapy, mindfulness, and social support produce more durable improvements? This is a research hypothesis, not an established treatment protocol."},{"tag":"p","t":"TMS combined with trauma-focused psychotherapy for PTSD"},{"tag":"p","t":"Kozel and colleagues (2018): A randomized, sham-controlled study of 103 veterans with PTSD examined repetitive transcranial magnetic stimulation (rTMS) combined with cognitive processing therapy (CPT). Participants receiving active rTMS plus CPT had greater reductions in clinician-rated PTSD symptoms than those receiving sham rTMS plus CPT. This supports further study of neuromodulation as an adjunct to evidence-based trauma psychotherapy, but does not establish that TMS immediately improves the ability to confront trauma."},{"tag":"p","t":"Fryml and colleagues (2019): A small proof-of-concept investigation combined rTMS with prolonged exposure therapy, with stimulation delivered during therapy sessions. This approach directly examines whether neuromodulation can influence trauma processing while exposure is occurring. The sample was only eight participants, so feasibility and preliminary outcomes should not be mistaken for established efficacy."},{"tag":"p","t":"Integrative research questions: Does the timing of stimulation (before, during, or after trauma processing) affect treatment response? Which targets and stimulation parameters best support extinction learning and emotion regulation? Can neuromodulation improve engagement or reduce dropout without disrupting the learning mechanisms of exposure-based treatment? Larger, adequately controlled studies are needed."},{"tag":"p","t":"Reasons to Be Glad to Be Alive Right Now"},{"tag":"p","t":"A living collection of evidence-based reasons for hope, wonder, and gratitude — without pretending that the world's problems aren't real. News disproportionately highlights threats and exceptional events; this page is a deliberate counterweight, not an argument for ignoring suffering."},{"tag":"p","t":"1. Clean energy is becoming cheaper. Solar and onshore wind are among the lowest-cost sources of new electricity generation in many markets. Storage and grid costs still matter, but lower generation costs expand the possibility of cleaner, more abundant energy."},{"tag":"p","t":"2. Energy independence is more achievable. Solar panels, batteries, and efficient appliances make it increasingly feasible for households and communities to produce and manage some of their own power."},{"tag":"p","t":"3. Fewer children die young. Global under-five mortality has fallen dramatically since 1990, even though preventable deaths remain far too common."},{"tag":"p","t":"4. Medicine can do things that once seemed impossible. Vaccines, targeted cancer treatments, gene therapies, and increasingly precise medical technologies have transformed what is treatable. Some emerging treatments remain experimental."},{"tag":"p","t":"5. Knowledge is extraordinarily accessible. A person with an internet connection can study languages, philosophy, science, art, and engineering using resources that were once restricted to elite institutions."},{"tag":"p","t":"6. Ordinary people have more creative tools. Affordable cameras, music software, digital publishing, 3D printing, and AI-assisted creation can help individuals make things previously requiring major studios or organizations."},{"tag":"p","t":"7. More ways of living are possible. Remote collaboration, distributed energy, and small-scale fabrication offer some people greater freedom to choose where and how they live, though access remains unequal."},{"tag":"p","t":"8. Science keeps revealing astonishing things. From exoplanets to the human brain, our understanding of nature continues to deepen. There is still so much left to discover."},{"tag":"p","t":"9. Human connection remains possible amid the noise. Friendship, love, community, music, art, shared meals, and acts of kindness are not obsolete technologies. They remain central sources of a good life."},{"tag":"p","t":"10. The future is not settled. Environmental restoration, more humane healthcare, better cities, and a culture that values beauty and meaning are all things people can help build."},{"tag":"p","t":"When the news makes everything feel bleak: Ask what is improving over decades, not just what went wrong today. Look for one concrete improvement, one beautiful thing nearby, and one action that makes life better for somebody else. Hope doesn't require certainty; it requires noticing real possibilities and participating in them."},{"tag":"p","t":"Ideas to expand: declining costs of batteries; improvements in air quality; conservation successes; disease eradication efforts; progress in education; advances in neuroscience and mental healthcare; inspiring local community projects; examples of beautiful, human-centered design."},{"tag":"p","t":"Starting sources for fact-checking and future updates: Our World in Data (ourworldindata.org); UNICEF child mortality data (data.unicef.org); International Renewable Energy Agency (irena.org); WHO (who.int). Revisit specific figures and dates before quoting them publicly."}],[{"tag":"h2","t":"A Shared History of Mysticism"},{"tag":"p","t":"Central question — How have different cultures cultivated experiences of the sacred, liberation, or self-transcendence, and what can these traditions contribute to human flourishing today?"},{"tag":"p","t":"The five historical periods below provide a comparative framework, with a possible sixth period emerging today. Their dates are approximate, and the traditions overlap. The surviving record skews toward written traditions and institutions. Oral and Indigenous traditions have their own histories, many of which continue today."},{"tag":"h3","t":"Ancient Roots (Before c. 800 BCE)"},{"tag":"p","t":"Egyptian funerary texts described ascent and transformation after death. Mesopotamian temples organized ritual life around relationships with gods and the cosmos. Early Vedic hymns probed the origins and unity of the world, while ancient Iranian religious traditions developed accounts of sacred order and ethical life. These records reveal how communities understood their place in a sacred cosmos. The experiences of individual practitioners are harder to recover."},{"tag":"h3","t":"The Axial Age (c. 800–200 BCE)"},{"tag":"p","t":"Karl Jaspers used the term Axial Age to describe roughly contemporaneous transformations in several societies. In India, early Upanishadic texts explored the relationship between ātman (self) and brahman (ultimate reality). Buddhist traditions developed a path from suffering through ethical conduct, meditation, and insight, including the teaching of anattā, or non-self. Jain traditions linked liberation to nonviolence and disciplined restraint. In China, the Daoist texts associated with Laozi and Zhuangzi explored the limits of language and rigid distinctions. In Greece, Plato dramatized the soul’s education and ascent toward intelligible reality."},{"tag":"p","t":"These traditions all ask how perception and conduct can change, but their answers differ. Plato’s account of the soul, Buddhist non-self, and Upanishadic inquiry into selfhood carry distinct commitments. Jaspers’s periodization is a way to compare developments across regions, and its scope and explanatory power remain debated."},{"tag":"h3","t":"Late Antiquity (c. 200–800 CE)"},{"tag":"p","t":"Contemplative disciplines and philosophies became more explicitly systematized. Plotinus described ascent toward the One in the Enneads. Christian desert communities cultivated disciplined prayer and attention, and Pseudo-Dionysius developed an approach to divine mystery through the limits of affirmative language. In South Asia, Nāgārjuna’s analysis of emptiness influenced Mahāyāna Buddhism, Buddhist tantric traditions began to develop, and Śaṅkara articulated an influential form of Advaita Vedānta. Early Chan took shape in China through centuries of Buddhist translation and adaptation. Early Islamic ascetic movements helped lay the groundwork for later Sufi traditions."},{"tag":"h3","t":"The Medieval Renaissance (c. 800–1500 CE)"},{"tag":"p","t":"Divine love became an especially visible theme alongside traditions of disciplined practice and philosophical inquiry. Sufi poets and teachers such as Rūmī and Ibn ʿArabī explored love, devotion, and spiritual transformation. Jewish Kabbalists developed symbolic readings of creation and divine life, including in the Zohar. Christian writers such as Hildegard of Bingen, Meister Eckhart, and Julian of Norwich gave distinct forms to visionary experience, detachment, and divine love. South Asian bhakti communities cultivated devotion through vernacular poetry and song, while Tibetan Buddhist lineages elaborated tantric and contemplative training. Many of these practices were transmitted through communities, teacher–student relationships, and texts."},{"tag":"h3","t":"Documented Exchange and Disputed Influence"},{"tag":"p","t":"Documented examples include the transmission of Indian Buddhist texts into China through translation networks and the later transmission of Chan lineages to Japan, where they developed as Zen. The Dunhuang manuscripts preserve evidence of Buddhist circulation and adaptation along the Silk Roads. The Arabic Theology of Aristotle contains adapted passages from Plotinus’s Enneads, providing a textual example of Greek philosophical material entering Arabic intellectual life."},{"tag":"p","t":"Direct Buddhist influence on Plato remains unsupported by surviving evidence. Achaemenid networks made contact between Greek and South Asian regions possible, and Greek encounters with Indian ascetics are better attested after Plato’s lifetime. Proposed Indian influence through Pythagoreanism is also disputed. Shared themes such as rebirth and purification can motivate comparison. Claims of borrowing require stronger evidence, such as identifiable intermediaries, translations, or traceable textual dependence."},{"tag":"h3","t":"The Modern Synthesis (c. 1800–Late 20th Century)"},{"tag":"p","t":"Translations, migration, religious reform, and colonial encounters brought contemplative traditions into new settings, often under unequal conditions. Vivekananda presented Vedānta to international audiences, and figures such as D. T. Suzuki introduced new readers to Zen. William James treated religious experience as a subject for psychology in The Varieties of Religious Experience (1902). Aldous Huxley’s The Perennial Philosophy (1945) argued for a shared spiritual core. That interpretation invites comparison while raising a question about how much a person’s language, training, and community shape what they experience and how they understand it."},{"tag":"h3","t":"Contemporary Contemplative Science"},{"tag":"p","t":"Researchers combine reports from practitioners with behavioral tasks, clinical trials, and measurements such as EEG and brain imaging. Anattā can prompt questions about how the sense of a stable self is constructed, while contemplative absorption can inform research on sustained attention. Sufi fanā and reports of ego dissolution invite comparison while retaining their distinct religious and experimental contexts. Lutz and colleagues’ 2004 EEG study of experienced Buddhist practitioners illustrates how researchers can measure changes during a specific meditation practice."},{"tag":"p","t":"Studies differ in their practices, populations, comparison groups, and outcomes. A systematic review by Goyal and colleagues found evidence of modest improvements in some measures of anxiety, depression, and pain in meditation programs. Studies of experience and brain activity can test specific psychological claims. Questions about ultimate reality require a different kind of inquiry."},{"tag":"h3","t":"A Possible New Mystical Golden Age"},{"tag":"p","t":"Wider access to teachings, renewed questions about meaning and belonging, and collaboration across contemplative traditions, psychology, and neuroscience create conditions for a possible new period of flourishing. The analogy to a second Axial Age remains speculative. Commercialization, shallow borrowing, and a focus on extraordinary states can weaken the ethical cultivation and relationships that sustain practice."},{"tag":"p","t":"Integrative research question — Under what conditions do contemplative practices produce durable changes in attention, compassion, relationships, and civic or ecological responsibility? For the Human Flourishing Project, the strongest evidence of a new golden age would be sustained improvements in how people live and care for one another."},{"tag":"p","t":"Starting sources for further study — Karl Jaspers, The Origin and Goal of History. Richard Seaford, The Origins of Philosophy in Ancient Greece and Ancient India. The International Dunhuang Programme. William James, The Varieties of Religious Experience. Lutz and colleagues (2004). Goyal and colleagues (2014)."}]];
function flourishingArticle(i){return '<article class="learn-text" style="white-space:pre-wrap;overflow-wrap:anywhere">'+FLOURISHING_CONTENT[i].map(p=>'<'+p.tag+'>'+esc(p.t)+'</'+p.tag+'>').join('')+'</article>';}
function flourishingLibrary(){return '<section class="card" style="margin-bottom:12px"><h3>Human Flourishing curriculum</h3><div role="tablist" aria-label="Curriculum subjects" style="display:flex;gap:6px;flex-wrap:wrap">'+['Daily education',...FLOURISHING_TABS.map(x=>x.name)].map((name,i)=>'<button role="tab" aria-selected="'+(flourishingTab===i-1)+'" class="btn '+(flourishingTab===i-1?'pri':'')+'" data-flourish="'+(i-1)+'">'+esc(name)+'</button>').join('')+'</div>'+(flourishingTab<0?'':'<div role="tabpanel" style="margin-top:16px"><h2>'+esc(FLOURISHING_TABS[flourishingTab].name)+'</h2><p>Full reading material imported from your Human Flourishing Project. Open the original document below for later additions.</p>'+flourishingArticle(flourishingTab)+'<div class="learn-links">'+FLOURISHING_TABS[flourishingTab].links.map(x=>'<a target="_blank" rel="noopener noreferrer" href="'+LEARNING_SOURCE.split('#')[0]+'#heading='+encodeURIComponent(x.anchor)+'">'+esc(x.label)+'</a>').join('')+'<a target="_blank" rel="noopener noreferrer" href="'+LEARNING_SOURCE+'">Open entire Human Flourishing Project</a></div></div>')+'</section>';}

{id:'centerfire',name:'Bolt-action .308 rifle',ammo:'.308 Winchester',price:18,ammoPrice:4,mag:4,kind:'rifle',intro:'A centerfire sporting rifle category associated with long-range target shooting and lawful hunting of certain larger game.',role:'Potential homestead role: lawful hunting where local conditions and personal circumstances justify it. It is not universally necessary for survival.',limits:'Greater noise, recoil, range, and safety burden than a small-caliber rifle. Safe handling, lawful use, and secure storage are essential.',alt:'For most homesteads, reliable food systems, first aid, communications, fencing, and animal-resistant storage are more broadly useful investments.'},

 const g=gearState(),el=$('#gear');
 el.innerHTML='<div class="learn-wrap"><div class="learn-hero"><small>HOMESTEAD / EQUIPMENT</small><h2>Survival equipment shop & encyclopedia</h2><p>Earn earth through Life HQ activities. Spend it on simplified virtual equipment and ammunition. No real-world purchases.</p></div><div class="card"><b>Available earth: '+S.res.earth+'</b> · Training targets hit: '+g.targets+' · Shots fired: '+g.shots+'<p><small>All actions below are fictional arcade-style interactions; they do not model actual ballistics.</small></p></div><div class="gear-grid">'+GEAR.map(x=>{let owned=g.owned.includes(x.id),loaded=g.loaded[x.id]||0,stock=g.ammo[x.id]||0;return '<div class="gear-item"><div class="gear-visual">'+gearShape(x.kind)+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.intro)+'</p><div><b>'+esc(x.ammo)+'</b> · Magazine: '+loaded+' / '+x.mag+' · Inventory: '+stock+'</div><div class="gear-btns"><button class="btn" data-buy="'+x.id+'" '+(owned||S.res.earth<x.price?'disabled':'')+'>'+(owned?'Owned':'Buy · '+x.price+' earth')+'</button><button class="btn" data-ammo="'+x.id+'" '+(!owned||S.res.earth<x.ammoPrice?'disabled':'')+'>Buy '+esc(x.ammo)+' · '+x.ammoPrice+' earth</button><button class="btn" data-equip="'+x.id+'" '+(!owned?'disabled':'')+'>'+(g.equipped===x.id?'Equipped':'Equip')+'</button><button class="btn" data-detail="'+x.id+'">Learn more</button></div></div>'}).join('')+'</div><div class="card"><h3>Practice range</h3><p>Equipped: '+esc(GEAR.find(x=>x.id===g.equipped)?.name||'None')+'</p><div class="gear-btns"><button class="btn" id="gear-reload">Reload</button><button class="btn pri" id="gear-fire">Fire at virtual target</button></div><p id="gear-feedback" aria-live="polite">Equip an item, buy ammunition, and reload to begin.</p></div><div class="card gear-info" id="gear-detail"><h3>Learning encyclopedia</h3><p>Select “Learn more” for an in-depth overview of each item and whether it is actually necessary for a self-sufficient homestead.</p></div></div>';
 el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let x=GEAR.find(z=>z.id===b.dataset.buy);if(g.owned.includes(x.id)||S.res.earth<x.price)return;S.res.earth-=x.price;g.owned.push(x.id);save();gearPage()});
 el.querySelectorAll('[data-ammo]').forEach(b=>b.onclick=()=>{let x=GEAR.find(z=>z.id===b.dataset.ammo);if(!g.owned.includes(x.id)||S.res.earth<x.ammoPrice)return;S.res.earth-=x.ammoPrice;g.ammo[x.id]=(g.ammo[x.id]||0)+x.mag;save();gearPage()});
 el.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{g.equipped=b.dataset.equip;save();gearPage()});
 el.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let x=GEAR.find(z=>z.id===b.dataset.detail);$('#gear-detail').innerHTML='<h2>'+esc(x.name)+'</h2><div class="gear-visual">'+gearShape(x.kind)+'</div><h3>What it is</h3><p>'+esc(x.intro)+'</p><h3>Is it necessary for a homestead?</h3><p>'+esc(x.role)+'</p><h3>Limitations, responsibilities, and safety</h3><p>'+esc(x.limits)+'</p><h3>Alternatives and priorities</h3><p>'+esc(x.alt)+'</p><h3>Real-world considerations</h3><p>Before considering any real equipment, review local laws, safe storage requirements, training options, land-use rules, and wildlife management guidance. The game economy is fictional; it does not represent market prices or purchasing advice.</p>';$('#gear-detail').scrollIntoView({behavior:'smooth',block:'start'})});
 $('#gear-reload').onclick=()=>{let x=GEAR.find(z=>z.id===g.equipped);if(!x)return toast('Equip an item first');let n=Math.min(x.mag-(g.loaded[x.id]||0),g.ammo[x.id]||0);if(n<=0)return toast('Buy ammunition or magazine already full');g.loaded[x.id]=(g.loaded[x.id]||0)+n;g.ammo[x.id]-=n;save();gearPage();toast('Reloaded '+n)};
 $('#gear-fire').onclick=()=>{let x=GEAR.find(z=>z.id===g.equipped);if(!x)return toast('Equip an item first');if(!(g.loaded[x.id]>0))return toast('Reload first');g.loaded[x.id]--;g.shots++;if(Math.random()<0.65)g.targets++;save();gearPage();$('#gear-feedback').textContent='Virtual shot registered. Practice target updated.'};
}



/* Public read-only Google Sheet sync. The owner must enable public access in Google Sheets. */
const REF_PUBLIC_CSV='https://docs.google.com/spreadsheets/d/1HxQRl6cWPYjb50flMfWpo2zrGfP8OQVt0VL-27tAbRA/gviz/tq?tqx=out:csv&sheet=Sheet1';
function parseRefCSV(csv){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<csv.length;i++){const c=csv[i];if(quote){if(c==='"'&&csv[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\\n'||c==='\\r'){if(c==='\\r'&&csv[i+1]==='\\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function refISO(v){const t=String(v||'').trim();if(/^\\d{4}-\\d{2}-\\d{2}/.test(t))return t.slice(0,10);const d=new Date(t);if(!Number.isNaN(d.getTime()))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return null}
function sheetToRef(csv){const table=parseRefCSV(csv),headers=table[0]||[],find=regex=>table.findIndex(r=>regex.test(String(r[1]||'').trim()));const index={emotional:find(/^Emotional$/i),mental:find(/^Mental\\s*$/i),physical:find(/^Physical\\s*$/i),spiritual:find(/^Spiritual\\s*$/i),diet:find(/^Diet:/i),wakeTime:find(/^What time did you wake/i),sleepHours:find(/^How many hours of sleep/i),substances:find(/^What substances/i),journal:find(/^Free Response:/i)};for(const k of ['emotional','mental','physical','spiritual'])index[k+'Note']=index[k]+1;const output=[];for(let c=2;c<headers.length;c++){const date=refISO(headers[c]);if(!date)continue;const v={date};let found=false;for(const[k]of REF_DOMAINS){const raw=table[index[k]]?.[c];const n=Number(raw);if(raw!==undefined&&raw!==''&&Number.isInteger(n)&&n>=1&&n<=10){v[k]=n;found=true}v[k+'Note']=table[index[k+'Note']]?.[c]||''}for(const k of ['diet','wakeTime','sleepHours','substances','journal'])v[k]=table[index[k]]?.[c]||'';if(found)output.push(v)}return output}
let refRemote=[],refSyncStatus='Not connected',refLastFetch=0;
async function syncRefSheet(force=false){if(!force&&Date.now()-refLastFetch<120000)return;refLastFetch=Date.now();refSyncStatus='Loading Google Sheet…';try{const res=await fetch(REF_PUBLIC_CSV,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const csv=await res.text();if(csv.trim().startsWith('<'))throw Error('Google sign-in or sharing required');refRemote=sheetToRef(csv);refSyncStatus='Google Sheet connected · '+refRemote.length+' dated entries';}catch(e){refSyncStatus='Sheet unavailable: enable Anyone with the link → Viewer (or Publish to web). Local entries remain available.'}if($('#reflect')&&!$('#reflect').classList.contains('hide'))reflect()}
function refMerged(){const map=new Map(refRemote.map(r=>[r.date,r]));for(const r of reflectionData())map.set(r.date,{...map.get(r.date),...r});return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}

/* ---------- Daily Reflection ---------- */
const REF_DOMAINS=[['emotional','Emotional','#dc7868'],['mental','Mental','#538cba'],['physical','Physical','#61a279'],['spiritual','Spiritual','#aa82c4']];
const REF_SHEET='https://docs.google.com/spreadsheets/d/1HxQRl6cWPYjb50flMfWpo2zrGfP8OQVt0VL-27tAbRA/edit';
function reflectionData(){if(!Array.isArray(S.reflections))S.reflections=[];return S.reflections}
function refToday(){return localDay()}
function refDetails(r){return 'Date: '+r.date+'\n'+REF_DOMAINS.map(([k,n])=>n+': '+(r[k]??'—')+'/10'+(r[k+'Note']?' — '+r[k+'Note']:'' )).join('\n')+'\nSleep: '+(r.sleepHours||'Not recorded')+' hours; wake: '+(r.wakeTime||'Not recorded')+'\nDiet: '+(r.diet||'Not recorded')+'\nSubstances: '+(r.substances||'Not recorded')+'\nJournal: '+(r.journal||'No entry');}
function refChart(rows){
 const W=760,H=330,L=48,R=18,T=22,B=48,iw=W-L-R,ih=H-T-B;
 const dates=rows.map(r=>r.date),min=0,max=10;
 const x=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1)),y=v=>T+ih-(Number(v)-min)*ih/(max-min);
 let parts=['<svg class="ref-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Four-domain reflection scores over time. Focus or hover on dots for daily notes.">'];
 for(let v=0;v<=10;v+=2){parts.push('<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'" stroke="currentColor" opacity=".13"/><text x="'+(L-12)+'" y="'+(y(v)+4)+'" font-size="12" text-anchor="end" fill="currentColor">'+v+'</text>')}
 const step=Math.max(1,Math.ceil(rows.length/7));dates.forEach((d,i)=>{if(i%step===0||i===rows.length-1)parts.push('<text x="'+x(i)+'" y="'+(H-18)+'" font-size="11" text-anchor="middle" fill="currentColor">'+esc(d.slice(5))+'</text>')});
 REF_DOMAINS.forEach(([key,name,color])=>{const points=rows.map((r,i)=>({i,v:Number(r[key])})).filter(p=>Number.isFinite(p.v)&&p.v>=1&&p.v<=10);if(points.length)parts.push('<polyline fill="none" stroke="'+color+'" stroke-width="3" points="'+points.map(p=>x(p.i)+','+y(p.v)).join(' ')+'"/>');points.forEach(p=>parts.push('<circle tabindex="0" role="button" aria-label="'+esc(name)+' '+p.v+' on '+rows[p.i].date+'" data-ref="'+p.i+'" cx="'+x(p.i)+'" cy="'+y(p.v)+'" r="6" fill="'+color+'" stroke="white" stroke-width="1.5"><title>'+esc(name)+' '+p.v+' — '+rows[p.i].date+'</title></circle>'))});
 parts.push('<text x="'+W/2+'" y="'+(H-2)+'" text-anchor="middle" font-size="12" fill="currentColor">Date</text></svg>');return parts.join('');
}
function reflect(){
 const el=$('#reflect'),rows=refMerged(),today=refToday(),r=rows.find(z=>z.date===today)||{date:today};
 const fields=REF_DOMAINS.map(([k,n])=>'<div class="ref-field"><label for="ref-'+k+'">'+n+' health (1–10)</label><input id="ref-'+k+'" type="number" min="1" max="10" step="1" value="'+(r[k]??'')+'" required></div><div class="ref-field"><label for="ref-'+k+'Note">'+n+' explanation</label><textarea id="ref-'+k+'Note">'+esc(r[k+'Note']||'')+'</textarea></div>').join('');
 el.innerHTML='<div class="learn-wrap"><div class="learn-hero"><small>LIFE HQ / REFLECTION</small><h2>Daily Reflection</h2><p>Track how you feel and what happened, then explore patterns over time.</p></div><div class="card"><h2>Your health over time</h2><div class="ref-legend">'+REF_DOMAINS.map(([k,n,c])=>'<span><i class="ref-dot" style="background:'+c+'"></i>'+n+'</span>').join('')+'</div>'+(rows.length?refChart(rows):'<p>No entries yet. Complete today’s reflection to start your graph.</p>')+'<div class="ref-tooltip" id="ref-detail" aria-live="polite">Hover, focus, or click any data point to see that day’s full reflection.</div><p class="ref-note">Correlations are exploratory; changes in sleep, diet, or substances do not establish causes.</p></div><div class="card"><h2>Today’s check-in · '+today+'</h2><form id="ref-form"><div class="ref-form">'+fields+'<div class="ref-field"><label for="ref-sleepHours">Hours slept</label><input id="ref-sleepHours" type="number" min="0" max="24" step=".25" value="'+esc(r.sleepHours||'')+'"></div><div class="ref-field"><label for="ref-wakeTime">Wake-up time</label><input id="ref-wakeTime" type="text" value="'+esc(r.wakeTime||'')+'" placeholder="e.g. 7:30 AM"></div><div class="ref-field"><label for="ref-diet">Food and drink (amounts)</label><textarea id="ref-diet">'+esc(r.diet||'')+'</textarea></div><div class="ref-field"><label for="ref-substances">Substances, medications, caffeine (amounts)</label><textarea id="ref-substances">'+esc(r.substances||'')+'</textarea></div></div><div class="ref-field"><label for="ref-journal">Free response — what else mattered today?</label><textarea id="ref-journal">'+esc(r.journal||'')+'</textarea></div><div class="learn-actions"><button class="btn pri" type="submit">Save today’s reflection</button><button class="btn" type="button" id="ref-export">Export reflections (JSON)</button><button class="btn" type="button" id="ref-import">Import JSON</button><input type="file" accept=".json,application/json" id="ref-file" style="display:none"></div></form><p class="ref-note">New entries save locally; the public Google Sheet is read-only. Existing sheet entries load automatically when public sharing is enabled. Import/export provides a backup; avoid using shared devices for private journal entries.</p><p><a href="'+REF_SHEET+'" target="_blank" rel="noopener noreferrer">Open existing Nightly Checkin spreadsheet</a></p></div></div>';
 el.querySelectorAll('[data-ref]').forEach(dot=>{const fn=()=>{$('#ref-detail').textContent=refDetails(rows[Number(dot.dataset.ref)])};dot.addEventListener('mouseenter',fn);dot.addEventListener('focus',fn);dot.addEventListener('click',fn)});
 $('#ref-form').onsubmit=e=>{e.preventDefault();let v={date:today};for(const[k]of REF_DOMAINS){let n=Number($('#ref-'+k).value);if(!Number.isInteger(n)||n<1||n>10)return toast('Each health score must be 1–10');v[k]=n;v[k+'Note']=$('#ref-'+k+'Note').value}for(const k of ['sleepHours','wakeTime','diet','substances','journal'])v[k]=$('#ref-'+k).value;if(v.sleepHours!==''&&(!Number.isFinite(Number(v.sleepHours))||Number(v.sleepHours)<0||Number(v.sleepHours)>24))return toast('Sleep hours must be 0–24');const all=reflectionData(),i=all.findIndex(z=>z.date===today);if(i>=0)all[i]=v;else all.push(v);save();reflect();toast('Reflection saved')};
 $('#ref-refresh').onclick=()=>syncRefSheet(true);
 $('#ref-export').onclick=()=>{const data=JSON.stringify({type:'lifehq-reflections',version:1,entries:reflectionData()},null,2);const blob=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='lifehq-reflections.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
 $('#ref-import').onclick=()=>$('#ref-file').click();
 $('#ref-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(j.type!=='lifehq-reflections'||!Array.isArray(j.entries))throw Error('Wrong format');const all=reflectionData();for(const row of j.entries){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(row.date)||!REF_DOMAINS.every(([k])=>Number.isInteger(Number(row[k]))&&Number(row[k])>=1&&Number(row[k])<=10))continue;const clean={date:row.date};for(const[k]of REF_DOMAINS){clean[k]=Number(row[k]);clean[k+'Note']=String(row[k+'Note']||'').slice(0,20000)}for(const k of ['sleepHours','wakeTime','diet','substances','journal'])clean[k]=String(row[k]||'').slice(0,20000);const i=all.findIndex(z=>z.date===row.date);if(i<0)all.push(clean);else all[i]=clean}save();reflect();toast('Imported reflections')}catch(err){toast('Invalid reflection JSON')}};
}

/* ---------- nav ---------- */
function show(s){['morning','dash','habits','home','gear','reflect','prog'].forEach(x=>$('#'+x).classList.toggle('hide',x!==s));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='reflect'){reflect();syncRefSheet()}if(s==='gear')gearPage();if(s==='morning')morning();if(s==='dash')dash();if(s==='habits')habits();if(s==='prog')prog();
  if(s==='home'){if(!G)initGL();else{fit();hud()}$('#cv').focus({preventScroll:true})}else G?.keys.clear()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));
show('morning');
</script></body></html>
