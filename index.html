<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life HQ</title>
<style>
:root{--bg:#f4ece0;--card:#fffaf2;--ink:#3b2f27;--mut:#8a7766;--acc:#c0623a;--ok:#6b8f55;--line:#e2d3bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1814;--card:#2a231d;--ink:#f0e4d4;--mut:#a89580;--acc:#e08a5c;--ok:#8fb577;--line:#41372d}}
:root[data-theme="dark"]{--bg:#1d1814;--card:#2a231d;--ink:#f0e4d4;--mut:#a89580;--acc:#e08a5c;--ok:#8fb577;--line:#41372d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
nav b{margin-right:auto;color:var(--acc);white-space:nowrap;align-self:center}
nav button,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:14px;max-width:1500px;margin:auto}.hide{display:none!important}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.cols{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 190px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:240px}
.col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.col.over{outline:2px dashed var(--acc)}
.task{display:flex;gap:6px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:grab}
.task span{flex:1;word-break:break-word}.task.done span{text-decoration:line-through;color:var(--mut)}
.task i{cursor:pointer;color:var(--mut);font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.habit{display:grid;grid-template-columns:130px repeat(31,22px);gap:4px;align-items:center;margin-bottom:6px;overflow-x:auto}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:none}
.dot.dim{visibility:hidden}.dot.on{border-color:transparent}
.hn{display:flex;gap:4px;align-items:center;cursor:pointer;font-weight:600}
.res{display:flex;gap:10px;flex-wrap:wrap}.res div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
#hs{position:relative;height:calc(100vh - 120px);min-height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.game-help{position:absolute;bottom:12px;left:12px;right:12px;display:grid;justify-items:start;gap:6px;pointer-events:none}.game-help>*{padding:6px 10px;border-radius:8px;background:#241d17e8;color:#fff5df;font-size:13px}.game-help strong:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#timer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:8}
#timer div{background:var(--card);padding:28px;border-radius:14px;text-align:center;max-width:320px}
#timer h1{font-size:48px;margin:6px 0}
small,.mut{color:var(--mut)}

#build-guide{width:min(640px,calc(100% - 24px));max-height:calc(100% - 32px);padding:22px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--card)}
#build-guide::backdrop{background:#1b1513b8}#build-guide a{color:var(--acc)}
.guide-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.guide-top h2{margin:2px 0 0}#build-guide h3{margin:16px 0 0}
#build-guide fieldset{margin:16px 0 0;border:1px solid var(--line);border-radius:8px}
#build-guide label{display:block;padding:5px 0;cursor:pointer}
.guide-feedback{color:var(--acc);min-height:1.4em;margin:6px 0}
.range-tool-photo{display:block;width:160px;max-width:100%;height:40px;object-fit:contain;margin:4px auto 0;background:#fff;border-radius:4px}

/* Morning HQ learning */
.learn-wrap{max-width:880px;margin:auto}.learn-hero{background:linear-gradient(125deg,#d8ad72,#ae6e43);color:#fff;border-radius:14px;padding:24px;margin-bottom:14px}.learn-hero h2{margin:5px 0}.learn-hero small{color:#fff}.learn-text{line-height:1.75;font-size:16px}.learn-text p{margin:0 0 14px}.learn-question{border-top:1px solid var(--line);padding:16px 0}.learn-choice{display:block;width:100%;text-align:left;white-space:normal;margin:7px 0}.learn-choice.selected{outline:2px solid var(--acc)}.learn-status{padding:10px;border-radius:8px;background:var(--bg);margin:12px 0}.learn-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.learn-links a{display:block;margin:9px 0;color:var(--acc);overflow-wrap:anywhere}

/* Survival equipment */
.gear-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gear-item{padding:16px;border:1px solid var(--line);border-radius:12px}.gear-visual{height:90px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d7c8a7,#9eaf94);border-radius:9px;margin-bottom:12px}.gear-visual svg{max-width:94%;height:70px}.gear-item p{line-height:1.6}.gear-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.gear-info{max-width:850px;line-height:1.75}.gear-info h3{margin-top:18px}

/* Daily reflection */
.ref-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.ref-field label{display:block;font-weight:650;margin-bottom:6px}.ref-field input,.ref-field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #a5a5a5;border-radius:8px;background:var(--bg);color:inherit}.ref-field textarea{min-height:80px}.ref-chart{width:100%;height:auto;max-height:430px;display:block}.ref-legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}.ref-legend span{display:inline-flex;align-items:center;gap:6px}.ref-dot{width:10px;height:10px;border-radius:50%;display:inline-block}.ref-tooltip{padding:12px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;line-height:1.5;min-height:55px}.ref-chart circle{cursor:pointer}.ref-chart circle:focus{stroke:#222;stroke-width:3}.ref-note{font-size:13px;opacity:.8}
</style></head><body>
<nav><b>Life HQ</b><button data-s="morning" class="on">Morning HQ</button><button data-s="dash">Dashboard</button><button data-s="habits">Habits</button><button data-s="home">Homestead</button><button data-s="gear">Equipment</button><button data-s="reflect">Daily Reflection</button><button data-s="prog">Progress</button></nav>
<main>
<section id="gear" class="hide"></section><section id="reflect" class="hide"></section><section id="morning"></section><section id="dash" class="hide"></section><section id="habits" class="hide"></section>
<section id="home" class="hide"><div id="hs"><canvas id="cv" tabindex="0" aria-label="Third-person homestead"></canvas><div class="hud" id="hud"></div><div class="game-help"><strong id="hint"></strong><span>WASD Walk · Drag Orbit · Scroll Zoom · Space Jump · E Interact · B Build · R Rotate · Left click Place</span></div></div></section>
<section id="prog" class="hide"></section>
</main><dialog id="build-guide" aria-labelledby="guide-title"></dialog><div id="toast"></div><div id="timer" class="hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLS=['Inbox','Next Actions','Scheduled','Projects','Waiting For','Someday/Maybe','Today'];
const COST={wall:{tires:4,earth:6},cistern:{tires:2,earth:4},panel:{tires:1,earth:3},battery:{tires:2,earth:3},greenhouse:{tires:3,earth:8},greywater:{tires:2,earth:5},farm:{tires:1,earth:5},compost:{tires:1,earth:3},rainbarrel:{tires:1,earth:3}},K='lifehq.v1';
const COLORS=['#c0623a','#6b8f55','#4f7ea8','#b58a2a'];
let S;
function fresh(){return{v:1,tasks:[],habits:[{id:'h1',name:'Meditate',color:COLORS[0]},{id:'h2',name:'Exercise',color:COLORS[1]},{id:'h3',name:'Study',color:COLORS[2]}],log:{},res:{tires:0,earth:0},walls:[],lessons:{},sim:{water:0,power:0},hist:[],odds:[70,20,8,2],month:new Date().toISOString().slice(0,7)}}
function load(){try{const j=localStorage.getItem(K);S=j?Object.assign(fresh(),JSON.parse(j)):fresh()}catch(e){S=fresh()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
load();
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1800)}
function reward(label,base){
  for(const k in base)S.res[k]=(S.res[k]||0)+base[k];
  let msg='+'+Object.entries(base).map(([k,v])=>v+' '+k).join(', '),r=Math.random()*100,[a,b,c]=S.odds,extra='';
  if(r>=a){if(r<a+b){S.res.tires++;extra=' · small bonus: +1 tire'}else if(r<a+b+c){S.res.earth+=3;S.res.tires++;extra=' · medium bonus: +3 earth, +1 tire'}else{S.res.tires+=3;S.res.earth+=5;extra=' · rare bonus: +3 tires, +5 earth'}}
  S.hist.unshift({t:Date.now(),label,msg:msg+extra});S.hist=S.hist.slice(0,50);toast(msg+extra);
}
/* ---------- Dashboard ---------- */
function dash(){
  const el=$('#dash'),open=S.tasks.filter(t=>!t.done&&t.col==='Today').slice(0,3);
  el.innerHTML=`<div class="bar"><input type="text" id="nt" placeholder="Capture a task (goes to Inbox)…"><button class="btn pri" id="add">Add</button><button class="btn pri" id="start">▶ START NEXT ACTION</button><button class="btn" id="just">JUST START (2 min)</button></div>
  ${campaignUI()}${bookCurriculumUI()}<div class="card"><b>Top Three Priorities</b> <small>(first three open tasks in Today)</small>${open.map((t,i)=>`<div>${i+1}. ${esc(t.t)}</div>`).join('')||'<div class="mut">Move tasks into Today.</div>'}</div>
  <div class="cols">${COLS.map(c=>`<div class="col" data-c="${c}"><h4>${c} · ${S.tasks.filter(t=>t.col===c&&!t.done).length}</h4>${S.tasks.filter(t=>t.col===c).map(t=>`<div class="task ${t.done?'done':''}" draggable="true" data-id="${t.id}"><input type="checkbox" ${t.done?'checked':''} data-chk="${t.id}"><span data-ed="${t.id}">${esc(t.t)}</span><i data-del="${t.id}" title="Delete">×</i></div>`).join('')}</div>`).join('')}</div>
  <small>Drag cards between columns. Double-click text to edit. Unchecking restores a task; a task only pays out once.</small>`;
  el.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>openBookChapter(Number(b.dataset.book)));
  const add=()=>{const v=$('#nt').value.trim();if(!v)return;S.tasks.push({id:'t'+Date.now(),t:v,col:'Inbox',done:false,paid:false});save();dash()};
  $('#add').onclick=add;$('#nt').onkeydown=e=>{if(e.key==='Enter')add()};
  $('#start').onclick=()=>{const t=S.tasks.find(t=>!t.done&&t.col==='Today')||S.tasks.find(t=>!t.done&&t.col==='Next Actions');t?focus(t,25*60,'Focus session'):toast('Add a task to Today or Next Actions first')};
  $('#just').onclick=()=>{const t=S.tasks.find(t=>!t.done&&t.col==='Today')||S.tasks.find(t=>!t.done);t?focus(t,120,'Just start: do only the tiniest first step'):toast('Add a task first')};
  el.querySelectorAll('.task').forEach(n=>n.ondragstart=e=>e.dataTransfer.setData('id',n.dataset.id));
  el.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();const t=S.tasks.find(t=>t.id===e.dataTransfer.getData('id'));if(t){t.col=c.dataset.c;save();dash()}}});
  el.querySelectorAll('[data-chk]').forEach(b=>b.onchange=()=>{const t=S.tasks.find(t=>t.id===b.dataset.chk);t.done=b.checked;if(t.done&&!t.paid){t.paid=true;reward('Task: '+t.t,{tires:2,earth:3})}save();dash()});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.del);save();dash()});
  el.querySelectorAll('[data-ed]').forEach(b=>b.ondblclick=()=>{const t=S.tasks.find(t=>t.id===b.dataset.ed),v=prompt('Edit task',t.t);if(v&&v.trim()){t.t=v.trim();save();dash()}});
}
function focus(t,secs,msg){
  const o=$('#timer');o.classList.remove('hide');let s=secs;
  const draw=()=>o.innerHTML=`<div><small>${msg}</small><h3>${esc(t.t)}</h3><h1>${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</h1><button class="btn" id="x">${s>0?'Stop':'Done'}</button></div>`;
  draw();const h=setInterval(()=>{if(--s<=0){s=0;clearInterval(h);toast('Nicely done. Keep going or stop, your call.')}draw();$('#x').onclick=end},1000);
  function end(){clearInterval(h);o.classList.add('hide')}$('#x').onclick=end;
}
/* ---------- Habits ---------- */
function habits(){
  const [y,m]=S.month.split('-').map(Number),days=new Date(y,m,0).getDate(),el=$('#habits');
  el.innerHTML=`<div class="bar"><button class="btn" id="pm">◀</button><b style="align-self:center">${new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="btn" id="nm">▶</button></div>
  <div class="card"><div class="habit"><span></span>${Array.from({length:31},(_,i)=>`<small style="text-align:center">${i<days?i+1:''}</small>`).join('')}</div>
  ${S.habits.map(h=>{const tot=Object.keys(S.log).filter(k=>k.startsWith(h.id+':')).length;return`<div class="habit"><div class="hn" data-h="${h.id}" title="Click to edit name and color">${esc(h.name)}<small>(${tot})</small></div>${Array.from({length:31},(_,i)=>{const d=i+1,k=`${h.id}:${S.month}-${String(d).padStart(2,'0')}`,on=S.log[k];return`<button class="dot ${i>=days?'dim':''} ${on?'on':''}" style="${on?'background:'+h.color:''}" data-k="${k}"></button>`}).join('')}</div>`}).join('')}</div>
  <small>Missed days carry no penalty; totals in brackets are lifetime completions. Each day earns +1 earth the first time it’s checked.</small>`;
  const shift=n=>{const d=new Date(y,m-1+n,1);S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');save();habits()};
  $('#pm').onclick=()=>shift(-1);$('#nm').onclick=()=>shift(1);
  el.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(S.log[k])delete S.log[k];else{S.log[k]=1;S.paidH=S.paidH||{};if(!S.paidH[k]){S.paidH[k]=1;reward('Habit',{earth:1})}}save();habits()});
  el.querySelectorAll('.hn').forEach(n=>n.onclick=()=>{const h=S.habits.find(h=>h.id===n.dataset.h),v=prompt('Habit name',h.name);if(v&&v.trim())h.name=v.trim();const c=prompt('Color (hex, or 1-4 for presets)',h.color);if(c)h.color=/^[1-4]$/.test(c)?COLORS[c-1]:c;save();habits()});
}
/* ---------- Progress ---------- */
function prog(){
  const done=S.tasks.filter(t=>t.done).length,c=t=>S.walls.filter(w=>w.t===t).length,n=S.walls.filter(w=>!w.t||w.t==='wall').length,lvl=(S.sim.stable||0)>=600?'Level 7: Self-Sufficient Homestead':c('greenhouse')&&c('greywater')&&c('cistern')&&c('panel')&&c('battery')&&n&&S.res.food>0?'Level 6: Integrated Homestead (started)':c('greenhouse')&&S.res.food>0?'Level 5: Food Production (started)':c('panel')&&c('battery')?'Level 4: Energy Independence (started)':c('cistern')?'Level 3: Water Independence (started)':n>=1?'Level 2: Shelter (in progress)':'Level 1: Empty Land';
  $('#prog').innerHTML=`<div class="card"><b>${lvl}</b><div class="mut">${done} tasks completed · ${Object.keys(S.log).length} habit days · ${n} wall sections · stable ${Math.min(600,Math.floor(S.sim.stable||0))}/600 s</div></div>
  <div class="card"><b>Bonus odds</b> <small>(transparent, adjustable, never paid or escalating; set all but “none” to 0 to turn bonuses off)</small><div class="bar" style="margin-top:8px">${['None','Small','Medium','Rare'].map((l,i)=>`<label>${l} % <input type="number" min="0" max="100" value="${S.odds[i]}" data-o="${i}" style="width:60px"></label>`).join('')}</div></div>
  <div class="card"><b>Recent rewards</b>${S.hist.slice(0,12).map(h=>`<div><small>${new Date(h.t).toLocaleTimeString()}</small> ${esc(h.label)} <span class="mut">${esc(h.msg)}</span></div>`).join('')||'<div class="mut">Nothing yet.</div>'}</div>
  <div class="bar"><button class="btn" id="ex">Export backup</button><button class="btn" id="im">Import backup</button><button class="btn" id="rs">Reset everything</button></div>
  <small>Educational game only: simplified, not real construction guidance.</small>`;
  document.querySelectorAll('[data-o]').forEach(i=>i.onchange=()=>{const v=S.odds.slice();v[i.dataset.o]=+i.value;const [,a,b,c]=v;if(a+b+c>100){toast('Bonus odds can’t exceed 100%');prog();return}v[0]=100-a-b-c;S.odds=v;save();prog()});
  $('#ex').onclick=()=>{const t=JSON.stringify(S);navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Backup copied to clipboard'),()=>prompt('Copy your backup',t))};
  $('#im').onclick=()=>{const t=prompt('Paste backup JSON');if(!t)return;try{const next=Object.assign(fresh(),JSON.parse(t));if(!Array.isArray(next.walls))throw new Error('Invalid structures');S=next;save();if(G)restoreParts();show('prog');toast('Imported')}catch(e){toast('Invalid backup')}};
  $('#rs').onclick=()=>{if(confirm('Erase all Life HQ data?')){S=fresh();save();location.reload()}};
}
/* ---------- Homestead (3D) ---------- */
let G=null,build=false,rot=0,selection='wall';
const PART_LABEL={wall:'Wall',cistern:'Cistern',panel:'Solar panel',battery:'Battery',greenhouse:'Greenhouse',greywater:'Greywater bed'};
// Increment a guide's version when its required reading or checks change.
const GUIDES = {
  wall: {version:1, sources:[
    ['Earthship Biotecture tire wall method','https://earthship.com/2018/09/13/how-to-pound-tires-and-build-tire-walls/'],
    ['Earthship Academy and hands-on training','https://earthship.com/learn/']
  ], sections:[
    ['Plan the wall','Decide whether the wall carries a roof, retains earth, or acts as a freestanding partition. Draw the roof-to-foundation load path, openings, and finish thickness. Ask the building department how it reviews alternative materials and have a structural designer specify the footing, allowable soil, bonding, reinforcement and roof connections. For a bermed wall, design drainage and waterproofing before placing the first tire.',
      'What needs to be designed before building a bermed wall?', ['Only the interior finish','Structure, waterproofing and drainage','Only the height of each tire'],1],
    ['Make and lay a test course','Stage sound tires sorted by size, suitable fill, a shovel, sledge, level, string line and eye and hand protection. On a prepared level base, center a tire on the layout, shovel soil into the tire and pound it outward into the sidewall cavity. Add soil and repeat until the cavity is packed and the top stays level. Check the test unit against the approved compaction and dimension criteria. Work from the first course upward, offsetting joints and checking each unit against the line before starting the next course.',
      'Where should the soil be compacted during tire filling?', ['Only on the flat top','Only in the central opening','Throughout the tire, including under its sidewalls'],2],
    ['Tie in, protect and inspect','Build opening frames, roof bearing and the top bond or tie detail from the approved drawings. Schedule inspections while connections are visible. Pack voids and finish exposed faces using specified compatible materials. Inspect below-grade waterproofing, protection and drainage before backfilling. Check for water intrusion after storms and investigate movement or recurring cracks.',
      'When should you inspect the drainage and waterproofing?', ['Before backfill hides them','After planting the berm','Only if plaster cracks'],0]
  ]},
  cistern: {version:1,sources:[
    ['EPA rainwater harvesting design examples','https://www.epa.gov/system/files/documents/2022-04/green-infrastructure-toolbox_rainwater-harvesting.pdf']
  ],sections:[
    ['Size the catchment and tank','Decide what the water will supply and confirm local collection and plumbing requirements. Estimate gross gallons from roof area in square feet × rain in inches × 0.623, then reduce for actual losses. For example, 500 square feet in a one-inch storm yields about 312 gallons before losses. Compare monthly rainfall and demand, especially through dry spells, before picking a rated tank.',
      'What does the roof-area calculation estimate?', ['The daily demand','The storm yield before losses','The required pump pressure'],1],
    ['Assemble the water path','Draw the route from roof to gutter, downspout, debris screen, first-flush diversion and opaque covered tank. Use the tank manufacturer’s base and anchorage details for a full tank. Provide screened vents and inlets, a cleanout, a draw-off, and a screened overflow that leads to an approved discharge away from the foundation. Keep the nonpotable plumbing separate and labeled.',
      'Where should the overflow discharge?', ['Into the footing trench','Into a drinking-water pipe','To an approved outlet away from the foundation'],2],
    ['Test and maintain','Test inflow and overflow with clean water before relying on rain. Check the base for settlement and fittings for leaks. Clean gutters, screens and first-flush equipment regularly and follow the manufacturer’s tank service instructions. For drinking water, work with the health authority on treatment, testing and plumbing protection.',
      'What should you test before the first storm?', ['Both inflow and overflow','Only the tank lid','Only the faucet color'],0]
  ]},
  panel: {version:1,sources:[
    ['U.S. Department of Energy guide to going solar','https://www.energy.gov/cmei/systems/articles/walk-me-through-it-step-step-guide-consumers-going-solar'],
    ['U.S. Department of Energy permitting and inspection','https://www.energy.gov/cmei/systems/permitting-and-inspection-rooftop-solar']
  ],sections:[

function selectTool(id){

    save();hud();toast('Restocked to 10 .22 LR rounds');
    return;
  }
  equipped=equipped===id?null:id;

function toolClick(ray){
  if(!guidePassed(equipped))return;
  const p=G.player.body.position;
  if(equipped==='popper'){
    if(Math.hypot(p.x-RANGE.x,p.z-RANGE.padZ)>1.8){toast('Stand on the blue pad in the northeast corner');return}
    if(!guidePassed('rounds')||!rangeStats().rounds){toast('Unlock or restock .22 LR rounds in Tools');return}
    const stats=rangeStats(), hit=ray.intersectObjects(G.rangeTarget)[0];
    stats.rounds--;stats.shots++;
    fireGameRifle(hit);
    if(hit)stats.hits++;
    S.range=stats;
    save();hud();
    toast(hit?(hit.object===G.bullseye?'Bullseye!':'Target hit!'):'Miss');
    return;
  }
  const point=ray.intersectObject(G.gr)[0]?.point;
  if(!point)return;
  if(equipped==='tape'){
    if(firstMark){
      toast(`Horizontal span: ${firstMark.distanceTo(point).toFixed(2)} m`);
      firstMark=null;
    }else{
      firstMark=point.clone();
      toast('First point set. Click the second point.');
    }
    return;
  }
  if(Math.hypot(point.x-DIG.x,point.z-DIG.z)>1.1||Math.hypot(p.x-DIG.x,p.z-DIG.z)>3){
    toast('Stand near the soil patch by spawn and click it');
    return;
  }
  if(S.dugPatch){toast('This patch has already been dug');return}
  S.dugPatch=true;
  S.res.earth+=2;
  G.digPatch.material.color.setHex(0x554433);
  save();hud();toast('Collected 2 earth');
}
function makeToolStations(){
  const {x,z,padZ}=RANGE, scene=G.sc;
  G.digPatch=block(scene,S.dugPatch?0x554433:0x895d3f,DIG.x,.02,DIG.z,1.65,.045,1.65);
  block(scene,0x53849b,x,.025,padZ,3.2,.05,3.2);
  block(scene,0x684834,x,1.2,z-.14,.19,2.4,.32);
  G.rangeTarget=[];
  for(const [radius,offset,color] of [[.85,0,0xf0d6a5],[.61,.028,0xd17456],[.37,.056,0xf0d6a5],[.17,.084,0x3f878b]]){
    const face=new THREE.Mesh(new THREE.CircleGeometry(radius,32),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));
    face.position.set(x,1.65,z+offset);
    scene.add(face);
    G.rangeTarget.push(face);
    G.bullseye=face;
  }
  for(let i=0;i<13;i++)block(scene,0x668e9a,17+i*.75,.015,5-i*1.92,.44,.025,.65);
}
function toolHint(){
  if(equipped==='tape')return 'Tape measure · Click two ground points';
  if(equipped==='shovel')return 'Shovel · Click the soil patch near spawn';
  if(equipped==='popper')return 'Ruger 10/22 · Follow blue markers to the pad · Click the target';
  return '';
}

const BOOK_CHAPTERS={
 1:{source:[['Earthship Biotecture — preparation','https://earthship.com/preparation-to-the-earthship-academy/'],['Dry Creek Earthship construction journal','https://drycreekearthship.wordpress.com/construction-process/']],
 sections:[
 ['What makes an Earthship different','An Earthship is a building approach that combines passive solar design, thermal mass, rainwater harvesting, renewable energy, food-growing spaces and on-site wastewater systems. The systems are interconnected: a greenhouse can contribute to solar heat gain, but glazing can also cause overheating; rainwater collection reduces dependence on utilities, but stored water still requires monitoring and treatment. A building does not become self-sufficient merely by adding solar panels. It must balance resource demand, storage capacity, climate, maintenance and occupant behavior.'],
 ['Thermal mass versus insulation','Thermal mass stores sensible heat and changes temperature relatively slowly. Dense earth-filled walls can buffer daily temperature swings, but they are not interchangeable with insulation. Insulation reduces the rate of heat flow; thermal mass delays and redistributes it. The useful combination depends on local climate, soil temperatures, solar exposure, moisture control and building geometry. A wall that performs well in a sunny high-desert setting may behave differently in a humid or persistently cloudy region.'],
 ['The sun as a design input','Solar orientation influences winter heat gain, summer overheating, daylight and photovoltaic production. In the northern hemisphere, equator-facing glazing often captures more low-angle winter sunlight, but the best design depends on the site. Shade from trees, mountains and neighboring buildings changes through the day and year. A good site study records seasonal sun paths, prevailing winds, drainage patterns and existing vegetation before a footprint is finalized.'],
 ['The six-system mindset','Think of the house as six interacting systems: shelter and thermal comfort; electricity; water capture and storage; water treatment and reuse; sanitation; and food production. For each system, list inputs, outputs, storage, failure points and maintenance tasks. For example, electricity has generation, conversion, batteries, loads and backup; water has collection, screening, storage, treatment, distribution and overflow. A design can fail when any one link is neglected.'],
 ['Embodied materials and durability','Reused tires, bottles and cans can divert materials from waste streams, but sustainability also depends on transportation, labor, structural suitability, moisture resistance and eventual repairs. Compare local availability and the full life cycle of materials rather than assuming that recycled automatically means low impact. Roof membranes, pumps, batteries, filters and sealants have service lives and require replacement plans.'],
 ['Planning your build sequence','A useful sequence is: investigate the site; establish climate and resource needs; design the building and utility systems together; validate structure, drainage and permits; prepare the site; build the envelope; install water and electrical infrastructure; test and commission; then monitor performance. This is a planning framework, not a universal construction recipe. Earthships vary widely in layout, wall design and systems.'],

let rangeImpact=null;

function movePlayer(dt) {
  const {player,keys,solids,th}=G, p=player.body.position;
  const forward=Number(keys.has('KeyW'))-Number(keys.has('KeyS'));
  const side=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));
  const speed=3.6/Math.max(1,Math.hypot(forward,side));
  const dx=(side*Math.cos(th)-forward*Math.sin(th))*speed*dt;
  const dz=(-side*Math.sin(th)-forward*Math.cos(th))*speed*dt;
  // Resolve one axis at a time so the player can slide along obstacles.
  const oldX=p.x,oldZ=p.z;
  const x=clamp(p.x+dx,-44,44),z=clamp(p.z+dz,-44,44);
  if(!overlaps(bodyBounds(x,p.y,p.z),solids))p.x=x;
  if(!overlaps(bodyBounds(p.x,p.y,z),solids))p.z=z;
  if(dx||dz)player.body.rotation.y=Math.atan2(dx,dz);
  player.vy-=14*dt;
  let y=Math.max(0,p.y+player.vy*dt);
  player.grounded=y===0;
  for(const box of solids){
    if(p.x+PLAYER_RADIUS<box.min.x||p.x-PLAYER_RADIUS>box.max.x||
      p.z+PLAYER_RADIUS<box.min.z||p.z-PLAYER_RADIUS>box.max.z)continue;
    if(player.vy<0&&p.y>=box.max.y&&y<=box.max.y){
      y=box.max.y+.0001;player.grounded=true;
    }
    if(player.vy>0&&p.y+1.85<=box.min.y&&y+1.85>=box.min.y){
      y=box.min.y-1.8501;player.vy=0;
    }
  }
  p.y=y;
  if(player.grounded)player.vy=0;
  const distance=Math.hypot(p.x-oldX,p.z-oldZ);
  player.stride+=distance*5;
  const swing=distance&&player.grounded?Math.sin(player.stride)*.55:0;
  player.limbs.forEach(({arm,leg},i)=>{
    leg.rotation.x=i?swing:-swing;
    arm.rotation.x=-leg.rotation.x*.75;
  });
}
function followPlayer() {
  const {cam,player,target,offset,cameraRay,hit,solids,th,ph,d}=G;
  target.copy(player.body.position);
  target.y+=1.39;
  offset.set(Math.sin(th)*Math.cos(ph),Math.sin(ph),Math.cos(th)*Math.cos(ph));
  cameraRay.set(target,offset);
  let distance=d;
  for(const box of solids){
    if(cameraRay.intersectBox(box,hit))distance=Math.min(distance,Math.max(.18,hit.distanceTo(target)-.2));

  if(offset.y<0)distance=Math.min(distance,(target.y-.22)/-offset.y);
  cam.position.copy(target).addScaledVector(offset,distance);

}

const FLOURISHING_CONTENT=[[{"tag":"h2","t":"1. Anthropology, Human Evolution & the Origins of Behavior"},{"tag":"p","t":"Central Question: Why do humans behave the way they do, and how have our evolutionary environments shaped the modern human brain, psychology, and social needs?"},{"tag":"h3","t":"1.1 Human Evolution and Prehistory"},{"tag":"p","t":"- Origins of Homo sapiens and earlier hominins"},{"tag":"p","t":"- Evolution of human cognition, consciousness, and intelligence"},{"tag":"p","t":"- The African savanna hypothesis and competing theories of human evolution"},{"tag":"p","t":"- The Ice Ages and their effects on human survival, cooperation, and adaptation"},{"tag":"p","t":"- Hunter-gatherer societies and ancestral environments"},{"tag":"p","t":"- The transition from nomadic lifestyles to agriculture and civilization"},{"tag":"p","t":"- The evolutionary mismatch hypothesis: ancient brains in modern environments"},{"tag":"p","t":"- Human behavioral diversity across different ecological environments"},{"tag":"h3","t":"1.2 Evolutionary Neuroscience"},{"tag":"p","t":"- Evolutionary origins of the human brain"},{"tag":"p","t":"- Comparative neuroscience: human versus other animal brains"},{"tag":"p","t":"- Evolution of the prefrontal cortex, limbic structures, and reward circuitry"},{"tag":"p","t":"- Dopamine and the evolution of motivation, resource acquisition, and reward"},{"tag":"p","t":"- Neural circuits underlying survival, fear, aggression, and attachment"},{"tag":"p","t":"- Evolution of social cognition, empathy, and cooperation"},{"tag":"p","t":"- Evolution of consciousness and self-awareness"},{"tag":"p","t":"- The default mode network and self-referential processing"},{"tag":"p","t":"- Neuroplasticity and evolutionary adaptations"},{"tag":"p","t":"- Mapping the major neural networks and understanding their evolutionary functions"},{"tag":"p","t":"- Limitations of evolutionary explanations and how to distinguish evidence from speculation"},{"tag":"h3","t":"1.3 Evolutionary Psychology and Human Motivation"},{"tag":"p","t":"- Why humans seek status, resources, power, and recognition"},{"tag":"p","t":"- Evolutionary origins of anxiety, depression, and threat sensitivity"},{"tag":"p","t":"- Competition versus cooperation"},{"tag":"p","t":"- Sexual selection, mating, attachment, and family structures"},{"tag":"p","t":"- Tribalism, in-group favoritism, and out-group hostility"},{"tag":"p","t":"- Altruism, reciprocity, and prosocial behavior"},{"tag":"p","t":"- Evolution of morality, religion, and spiritual beliefs"},{"tag":"p","t":"- Why humans pursue meaning and purpose"},{"tag":"p","t":"- Evolutionary explanations of greed and accumulation"},{"tag":"h3","t":"1.4 Ancestral Social Systems"},{"tag":"p","t":"- Optimal human group sizes and the evidence surrounding Dunbar's number"},{"tag":"p","t":"- Kinship networks and extended families"},{"tag":"p","t":"- Small-group living versus large-scale societies"},{"tag":"p","t":"- Collectivism versus individualism"},{"tag":"p","t":"- Egalitarianism and hierarchy in hunter-gatherer societies"},{"tag":"p","t":"- Shared resources and communal child-rearing"},{"tag":"p","t":"- Social isolation and loneliness as evolutionary mismatches"},{"tag":"p","t":"- The importance of belonging, ritual, and collective identity"},{"tag":"p","t":"- Cross-cultural differences in social organization"},{"tag":"h3","t":"1.5 Human History and the Development of Civilization"},{"tag":"p","t":"- The Agricultural Revolution"},{"tag":"p","t":"- Emergence of cities, states, governments, and empires"},{"tag":"p","t":"- Origins of private property and wealth accumulation"},{"tag":"p","t":"- Historical patterns of inequality, domination, and resistance"},{"tag":"p","t":"- Industrialization and its effects on human psychology"},{"tag":"p","t":"- Colonialism, globalization, and cultural transformation"},{"tag":"p","t":"- Changes in working hours, leisure, community, and quality of life"},{"tag":"p","t":"- How technological revolutions reshape human behavior"},{"tag":"h3","t":"1.6 Lessons for Human Flourishing"},{"tag":"p","t":"- Which ancestral practices remain beneficial today?"},{"tag":"p","t":"- What social environments best support psychological well-being?"},{"tag":"p","t":"- What can contemporary hunter-gatherer societies teach us?"},{"tag":"p","t":"- Which aspects of modern life conflict with evolved human needs?"},{"tag":"p","t":"- How can evolutionary knowledge inform psychotherapy and community design?"},{"tag":"h2","t":"Ongoing learning library"}],[{"tag":"h2","t":"2. Neuroscience, Psychology & the Science of Human Well-Being"},{"tag":"p","t":"Central Question: What constitutes optimal psychological functioning, and how can we harness our neural systems to promote flourishing rather than suffering?"},{"tag":"h3","t":"2.1 The Neuroscience of Happiness and Suffering"},{"tag":"p","t":"- Neural mechanisms of happiness, pleasure, and contentment"},{"tag":"p","t":"- Hedonic versus eudaimonic well-being"},{"tag":"p","t":"- Dopamine, serotonin, oxytocin, endorphins, and other neuromodulators"},{"tag":"p","t":"- Reward prediction, reinforcement learning, and motivation"},{"tag":"p","t":"- The neuroscience of attachment and belonging"},{"tag":"p","t":"- Stress physiology, cortisol, and allostatic load"},{"tag":"p","t":"- Neural mechanisms of anxiety, depression, rumination, and addiction"},{"tag":"p","t":"- Default mode network, salience network, and executive control network"},{"tag":"p","t":"- Neuroplasticity and long-term psychological change"},{"tag":"p","t":"- Neural correlates of self-transcendence and meaning"},{"tag":"h3","t":"2.2 Modern Society and the Exploitation of Human Psychology"},{"tag":"p","t":"- The attention economy"},{"tag":"p","t":"- Behavioral conditioning and variable-ratio reinforcement"},{"tag":"p","t":"- Social media algorithms and compulsive engagement"},{"tag":"p","t":"- Infinite scrolling, swiping, and intermittent rewards"},{"tag":"p","t":"- Smartphone addiction and problematic technology use"},{"tag":"p","t":"- Advertising, consumer psychology, and manufactured desires"},{"tag":"p","t":"- Children's media, including Cocomelon, and the evidence concerning overstimulation"},{"tag":"p","t":"- Video games, gambling mechanics, and behavioral reinforcement"},{"tag":"p","t":"- Pornography, digital stimulation, and reward sensitivity"},{"tag":"p","t":"- Corporate applications of behavioral neuroscience"},{"tag":"p","t":"- Persuasive technology, surveillance capitalism, and algorithmic manipulation"},{"tag":"p","t":"- Evidence-based distinctions between addiction, habit, and high engagement"},{"tag":"h3","t":"2.3 The Foundations of Optimal Human Health"},{"tag":"p","t":"- Sleep duration, quality, and circadian rhythms"},{"tag":"p","t":"- Nutrition and dietary patterns"},{"tag":"p","t":"- Exercise, movement, and physical conditioning"},{"tag":"p","t":"- Sunlight, outdoor exposure, and nature"},{"tag":"p","t":"- Social connection, intimacy, and community"},{"tag":"p","t":"- Meaningful work and purpose"},{"tag":"p","t":"- Rest, leisure, and play"},{"tag":"p","t":"- Sexual health and intimate relationships"},{"tag":"p","t":"- Stress regulation and emotional resilience"},{"tag":"p","t":"- Environmental toxins, air pollution, and microplastics"},{"tag":"p","t":"- Substance use and psychopharmacology"},{"tag":"p","t":"- The relationship between physical and psychological health"},{"tag":"h3","t":"2.4 Optimal Psychological Functioning"},{"tag":"p","t":"- Self-actualization and humanistic psychology"},{"tag":"p","t":"- Self-determination theory: autonomy, competence, and relatedness"},{"tag":"p","t":"- Psychological flexibility and acceptance"},{"tag":"p","t":"- Emotional regulation and distress tolerance"},{"tag":"p","t":"- Resilience, post-traumatic growth, and adaptation"},{"tag":"p","t":"- Flow states and intrinsic motivation"},{"tag":"p","t":"- Gratitude, compassion, and prosocial behavior"},{"tag":"p","t":"- Meaning-making and existential fulfillment"},{"tag":"p","t":"- Creativity, curiosity, and lifelong learning"},{"tag":"p","t":"- Psychological needs across the lifespan"},{"tag":"h3","t":"2.5 Social and Environmental Determinants of Mental Health"},{"tag":"p","t":"- Poverty, inequality, and psychological distress"},{"tag":"p","t":"- Housing security and environmental quality"},{"tag":"p","t":"- Education and access to opportunity"},{"tag":"p","t":"- Healthcare accessibility"},{"tag":"p","t":"- Social isolation and community fragmentation"},{"tag":"p","t":"- Employment, work schedules, and occupational stress"},{"tag":"p","t":"- Discrimination and structural disadvantage"},{"tag":"p","t":"- Urban versus rural environments"},{"tag":"p","t":"- Cross-cultural differences in mental health and happiness"},{"tag":"p","t":"- The relationship between economic security and psychological freedom"},{"tag":"h3","t":"2.6 Evidence-Based Approaches to Human Flourishing"},{"tag":"p","t":"- Positive psychology and its limitations"},{"tag":"p","t":"- Mindfulness-based interventions"},{"tag":"p","t":"- Cognitive behavioral therapies"},{"tag":"p","t":"- Humanistic and existential psychotherapy"},{"tag":"p","t":"- Acceptance and commitment therapy"},{"tag":"p","t":"- Compassion-focused interventions"},{"tag":"p","t":"- Psychedelic-assisted psychotherapy research"},{"tag":"p","t":"- Neuromodulation: TMS, tVNS, focused ultrasound, and neurofeedback"},{"tag":"p","t":"- Lifestyle medicine and behavioral interventions"},{"tag":"p","t":"- Community-based mental healthcare"},{"tag":"p","t":"- Integrative approaches combining biological, psychological, social, and spiritual factors"},{"tag":"h3","t":"2.7 Designing Optimal Systems for Well-Being"},{"tag":"p","t":"- What makes a psychologically healthy family?"},{"tag":"p","t":"- What makes a psychologically healthy community?"},{"tag":"p","t":"- What does an optimal educational system look like?"},{"tag":"p","t":"- How should work be structured to promote well-being?"},{"tag":"p","t":"- Which healthcare models produce the best population outcomes?"},{"tag":"p","t":"- What governmental and economic conditions predict flourishing?"},{"tag":"p","t":"- How can technology support rather than undermine psychological health?"},{"tag":"h3","t":"2.8 Portable EEG, DMN–DAN Anticorrelation & Objective Treatment Monitoring"},{"tag":"p","t":"Central research question: Could a portable, repeated EEG assessment estimate an individual patient's default mode network (DMN) relationship with task-positive networks and provide an objective, longitudinal correlate of therapeutic response? The idea resembles bruxism-tracking wearables such as dia-BRUXO, but EEG measures scalp potentials and must infer distributed networks rather than directly recording the relevant muscle activity."},{"tag":"h4","t":"2.8.1 Scientific concept and three levels of validation"},{"tag":"p","t":"1. DMN-state detection: EEG-based features and machine learning can estimate when DMN-related activity patterns occur, but they do not directly measure the fMRI-defined DMN."},{"tag":"p","t":"2. Network anticorrelation: Estimating negative coupling between the DMN and dorsal attention network (DAN), or other task-positive networks, requires EEG source reconstruction, connectivity analysis, and ideally validation against simultaneous EEG–fMRI. DMN identification alone is not an anticorrelation measurement."},{"tag":"p","t":"3. Therapeutic biomarker: To show that an EEG-derived network score tracks clinical progress, it must demonstrate within-person reliability, sensitivity to meaningful change, and added predictive/clinical value over questionnaires, behavior, and standard clinical evaluation. That last step is not established."},{"tag":"h4","t":"2.8.2 Closest empirical studies"},{"tag":"p","t":"• Cooray et al. (2024), “Default Mode Network Detection using EEG in Real-time”: Applied a hidden Markov model to a public dataset and reported 95% DMN state-detection accuracy and r = 0.617 for estimated DMN fractional occupancy. This is a proof of concept for EEG-based DMN monitoring, not 95% accuracy in determining treatment success or a direct measure of DMN–DAN anticorrelation."},{"tag":"p","t":"• NIMH-funded Drexel study (NCT05592600), “Investigating Electroencephalographic Predictors of Default Mode Network Anticorrelation for Personalized Neurofeedback”: Investigated whether individual EEG features can predict fMRI-measured DMN antagonism using simultaneous EEG–fMRI and neurofeedback paradigms. Its registry record should be consulted for design/results; a registered study is not itself clinical biomarker validation."},{"tag":"p","t":"• Kucyi group (2026 preprint), “Electroencephalographic activity patterns distinguish interdigitated default and frontoparietal networks”: Reported distinct EEG signatures of default and frontoparietal network subdivisions using repeated EEG–fMRI measurements. Preliminary/non-peer-reviewed; relevant to personalized network estimation, not yet clinical outcome monitoring."},{"tag":"p","t":"• “EEG correlates of time-varying BOLD functional connectivity” (2013): Simultaneous EEG–fMRI found associations between EEG alpha power and changes in DMN–DAN anticorrelation. Alpha power is a correlate influenced by vigilance and arousal—not a standalone, specific anticorrelation readout."},{"tag":"p","t":"• Song et al. (2026), “Machine learning-based source-level EEG functional network biomarkers of antidepressant treatment response in major depressive disorder”: A 47-patient depression study analyzed baseline source-level EEG network features and reported about 83% cross-validated classification accuracy for later antidepressant response. Promising but small, predictive rather than longitudinal, and not a DMN–DAN anticorrelation tracker."},{"tag":"p","t":"• “Individualized functional connectome identifies treatment-response biomarkers in patients with depression” (2026): A small personalized fMRI-connectivity study related changes in large-scale networks, including DMN and attention/control networks, to symptom change. It motivates individualized network metrics but does not validate portable EEG monitoring."},{"tag":"h4","t":"2.8.3 Candidate platforms and software"},{"tag":"p","t":"• BrainMaster BrainAvatar: Clinical-oriented qEEG/neurofeedback ecosystem with source-estimation and connectivity options. Existing coherence/connectivity outputs should not be interpreted as a validated DMN–DAN therapeutic response score."},{"tag":"p","t":"• mBrainTrain Smarting PRO X: Research-grade mobile, wireless 64-channel EEG and raw signal access; an attractive platform for individualized source-level network analyses and repeated recordings."},{"tag":"p","t":"• Neuroelectrics Enobio 32: Wireless 32-channel research EEG with signal access, mapping, and analysis options; may support a less bulky longitudinal research workflow."},{"tag":"p","t":"• MNE-Python: Open-source EEG/MEG preprocessing, source estimation, and connectivity-analysis toolkit. The core requirement is raw EEG access plus sufficiently dense and reproducible electrode coverage; a consumer EEG headband or vendor “wellness” score is not an interchangeable substitute."},{"tag":"h4","t":"2.8.4 Proposed measurement architecture"},{"tag":"p","t":"Portable 32–64-channel EEG → standardized rest, breath-focused attention, and internal/external task-switching conditions → quality control and artifact rejection → spectral/time-frequency features and individualized source reconstruction → DMN-versus-DAN/frontoparietal network estimates (with uncertainty) → session-by-session dashboard compared with decentering, rumination, depression/anxiety, and cognitive/behavioral outcomes."},{"tag":"p","t":"The strongest validation path begins with paired EEG–fMRI calibration to test prediction of fMRI-measured connectivity, then repeat-session reliability and sensitivity-to-change studies, and finally prospective trials to see if the EEG-derived measure predicts clinically meaningful improvement beyond conventional assessment. Compare within-person baselines rather than treating one group-average threshold as optimal for everyone."},{"tag":"h4","t":"2.8.5 Major cautions and open questions"},{"tag":"p","t":"• More negative DMN–DAN coupling is not universally better. The DMN supports autobiographical memory, self-relevant thought, and future planning; healthy functioning may involve flexible context-dependent coordination rather than maximal anticorrelation."},{"tag":"p","t":"• fMRI anticorrelations depend on processing choices, including global signal regression; EEG source-level connectivity is affected by volume conduction, spatial leakage, artifacts, electrode positioning, eye activity, sleepiness, medication, and vigilance."},{"tag":"p","t":"• An objective physiological signal is not automatically a valid clinical outcome measure. Avoid equating EEG alpha power, qEEG coherence, machine-learning classifier accuracy, or neurofeedback response with demonstrated psychotherapy benefit."},{"tag":"p","t":"• Important endpoint: personalized network flexibility and appropriate switching among internally focused and externally focused states—not necessarily a monotonic rise in anticorrelation. Test construct validity and change against symptoms, functioning, mindfulness/decentering, and behavior."},{"tag":"h4","t":"2.8.6 Potential application to integrative psychotherapy"},{"tag":"p","t":"This line of research could eventually complement measurement-based care across mindfulness training, psychotherapy, TMS, and other neuromodulation approaches. In a pilot, repeated EEG might quantify individualized changes in large-scale brain-network dynamics; interpretation must remain exploratory until replication, clinical validation, and evidence of added value. The gap is not merely detecting the DMN, but proving a portable, personalized EEG-derived network measure can monitor meaningful therapeutic response over time."},{"tag":"h4","t":"Selected sources and starting points"},{"tag":"p","t":"Cooray et al. (2024) – DMN detection with EEG"},{"tag":"p","t":"ClinicalTrials.gov NCT05592600 – EEG predictors of DMN anticorrelation"},{"tag":"p","t":"Kucyi group (2026) – EEG signatures of default/frontoparietal networks (preprint)"},{"tag":"p","t":"EEG correlates of time-varying BOLD functional connectivity"},{"tag":"p","t":"Song et al. (2026) – source-level EEG and antidepressant response"},{"tag":"p","t":"Individualized functional connectome and depression response (2026)"},{"tag":"p","t":"BrainMaster BrainAvatar"},{"tag":"p","t":"mBrainTrain Smarting PRO X"},{"tag":"p","t":"Neuroelectrics Enobio 32"},{"tag":"p","t":"MNE-Python documentation"},{"tag":"h2","t":"Ongoing learning library"},{"tag":"p","t":"World happiness and flourishing research"},{"tag":"p","t":"World Happiness Report 2026: Finland ranked first, followed by Iceland and Denmark. The United States ranked 23rd and Canada 25th. Rankings reflect average self-reported life evaluations, rather than every aspect of well-being."},{"tag":"p","t":"Global Flourishing Study 2025: Indonesia, Mexico, and the Philippines led its multidimensional flourishing comparison. The United States ranked 15th among the 23 populations studied. The study examines meaning, relationships, character, health, and life satisfaction, so its rankings are not directly comparable to those in the World Happiness Report."},{"tag":"p","t":"Research question: Why do life satisfaction rankings and multidimensional flourishing rankings differ, and what can this teach us about designing healthier communities and integrative treatment?"},{"tag":"p","t":"Cross-national depression and anxiety symptoms: Poland, Sweden, Germany, and the United States"},{"tag":"p","t":"In a secondary analysis of the Global Flourishing Study using the PHQ-4 screening instrument, approximately 14% of respondents in Poland screened positive for substantial depressive symptoms, compared with 20% in the United States—a difference of 6 percentage points, or a roughly 43% higher rate in the US relative to Poland. Approximate depression-screening proportions were 16% in Germany and 18% in Sweden."},{"tag":"p","t":"For substantial anxiety symptoms, the comparison was approximately 13% in Poland versus 24% in the United States, an 11-percentage-point difference. These figures describe symptom-screening thresholds in sampled respondents, not diagnosed major depressive disorder or anxiety-disorder prevalence. Cultural response patterns, sampling, and measurement differences complicate country rankings."},{"tag":"p","t":"Research implication: Low psychological distress, high life satisfaction, and multidimensional flourishing are distinct outcomes. Investigate potential explanatory factors—social support, economic security, work conditions, healthcare access, culture, and reporting differences—without inferring causation from cross-country comparisons. Compare findings with age-standardized Global Burden of Disease estimates before drawing conclusions about clinical disorder prevalence."},{"tag":"p","t":"Silexan (standardized oral lavender oil) — depression and anxiety research"},{"tag":"p","t":"A randomized eight-week trial of approximately 498 adults with mild-to-moderate major depressive disorder compared 80 mg/day Silexan, sertraline, and placebo. Reported remission rates were 44.4%, 45.2%, and 32.6%, respectively. Silexan significantly improved depression ratings compared with placebo but did not outperform sertraline; similar observed outcomes do not establish formal equivalence or noninferiority."},{"tag":"p","t":"Earlier randomized trials investigated Silexan primarily for anxiety, including generalized anxiety disorder, and reported benefits versus placebo. Comparisons with paroxetine should not be interpreted as definitive superiority over standard medications. The formulation is a standardized oral capsule, not aromatherapy or ordinary lavender essential oil."},{"tag":"p","t":"Clinical/research considerations: assess replication by independent groups, adverse events and longer-term outcomes, product standardization, funding/conflicts of interest, and whether benefit extends to severe depression. This is an emerging integrative pharmacotherapy research lead, not a recommendation to replace established treatment."},{"tag":"p","t":"Original depression study: https://pmc.ncbi.nlm.nih.gov/articles/PMC12500811/"},{"tag":"p","t":"STAR*D antidepressant treatment study"},{"tag":"p","t":"The large US STAR*D study enrolled 4,041 outpatients with major depression and evaluated successive treatment steps, beginning with citalopram. The original 2006 report estimated 67% cumulative remission across up to four steps, assuming patients who dropped out would have remitted at the same rate as those who continued. Remission rates among participants entering each successive step were approximately 36.8%, 30.6%, 13.7%, and 13.0%; these are not four percentages of the original full sample."},{"tag":"p","t":"A 2023 BMJ Open patient-level reanalysis reported 35.0% cumulative remission using the protocol-specified Hamilton Depression Rating Scale and eligibility criteria, or 41.3% when supplementing missing scores with another measure. The difference illustrates the importance of outcome definitions, missing data, and dropout assumptions. STAR*D did not include a placebo group for its initial treatment, so it cannot alone quantify drug efficacy versus placebo."},{"tag":"p","t":"For the integrative clinic framework: track sustained recovery, functioning, relapse, treatment burden, and nonresponse—not just acute symptom remission. Compare medication sequencing with psychotherapy, neuromodulation, and multimodal care without treating this study as evidence that medications are ineffective."},{"tag":"p","t":"Original study: https://psychiatryonline.org/doi/10.1176/ajp.2006.163.11.1905"},{"tag":"p","t":"Reanalysis: https://bmjopen.bmj.com/content/13/7/e063095"},{"tag":"p","t":"Harvard Study of Adult Development — Longitudinal evidence on relationships and well-being"},{"tag":"p","t":"Begun in 1938, this ongoing longitudinal research initially followed 268 Harvard College men and 456 boys from disadvantaged Boston neighborhoods, later incorporating spouses and descendants. Researchers tracked health, relationships, psychological functioning, and life circumstances across adulthood."},{"tag":"p","t":"Key findings: The quality of close, supportive relationships is strongly associated with happiness, physical health, and healthier aging. Midlife relationship satisfaction predicted aspects of later-life health. Social isolation and chronically conflictual relationships were associated with poorer well-being. These are observational associations, not proof that relationships alone cause longevity or happiness; the original male, geographically limited cohorts constrain generalizability."},{"tag":"p","t":"Integrative framework implications: Assess loneliness, attachment, and relationship quality alongside symptoms. Consider group therapy, family and couples work, community belonging, and opportunities for sustained supportive relationships as core components of an integrative clinic. Evaluate social connection, purpose, functioning, and long-term health—not just symptom reduction."},{"tag":"p","t":"Sources: https://www.adultdevelopmentstudy.org/ ; Waldinger & Schulz (2023), The Good Life."},{"tag":"p","t":"Outpatient precision mental health clinic — longitudinal neurobehavioral measurement (concept, November 2026)"},{"tag":"p","t":"Vision: Build an accessible outpatient integrative treatment center combining psychotherapy, mindfulness, group and experiential/adventure approaches, and appropriately indicated neuromodulation (TMS, potentially neurofeedback). Research would support clinical personalization rather than be the primary mission. The distinguishing feature is repeated measurement to identify whether an individual is improving and guide treatment adjustments."},{"tag":"p","t":"Clinical pathway: (1) baseline clinical interview, goals, symptom and functional measures, brief cognitive battery, optional research-oriented EEG; (2) personalized treatment selection based on clinical evidence, preferences and contraindications; (3) repeated patient-reported and behavioral assessments; (4) clinician review of response and treatment adaptation; (5) follow-up to assess durability and relapse. An illustrative package is 12 weeks, with brief symptom tracking weekly, fuller assessments every 2–4 weeks, and periodic EEG only where feasible and interpretable."},{"tag":"p","t":"Measurement domains: negative self-referential thinking/rumination (Perseverative Thinking Questionnaire or Ruminative Responses Scale); decentering (Experiences Questionnaire); psychological flexibility (CompACT or MPFI); depression and anxiety (PHQ-9, GAD-7); function (WHODAS 2.0 and personal goals); attention and cognitive flexibility (Stroop/Flanker/sustained-attention tasks, accounting for practice effects); sleep, activity and autonomic signals where useful. Ecological momentary assessment via brief smartphone prompts can sample rumination, mood, context and avoidance in everyday life, reducing reliance on retrospective reports."},{"tag":"p","t":"Neuroscience hypothesis: Therapeutic progress may involve more adaptive, context-sensitive interactions among default mode, executive-control and salience systems—not simply lower DMN activity or maximally negative DMN/task-positive anticorrelation. The DMN also supports healthy self-reflection and social cognition. Scalp EEG does not directly measure fMRI-defined DMN activation or anticorrelation; high-density EEG with source modeling and connectivity analysis can provide exploratory electrophysiological candidates, but source leakage, vigilance, reproducibility and individual-level clinical validity are substantial limitations. Validate EEG features against clinical outcomes and, where possible, fMRI in a research subset. Do not interpret proprietary neurofeedback metrics as validated universal therapeutic-change biomarkers without independent evidence."},{"tag":"p","t":"Neuromodulation: SAINT is an intensive, individualized fMRI-guided accelerated TMS approach; a standard TMS system does not automatically reproduce its targeting, schedule, regulatory status or licensed workflow. Investigate approved clinical TMS services separately from research collaborations on personalized stimulation. Treatment selection must follow indications, safety screening and relevant professional requirements."},{"tag":"p","t":"Interpretation and research: Track convergence across symptom, rumination, decentering, functioning, cognitive and exploratory neural measures. Correlation between an EEG shift and clinical improvement does not establish mechanism or causality, especially when several treatments are delivered simultaneously. Distinguish prognostic markers (who improves) from predictive markers (who benefits more from treatment A versus B). Start with measurement-based care and observational longitudinal data; later use controlled or sequential treatment designs and external validation to test treatment-matching rules. Do not use unvalidated EEG markers to make automatic treatment decisions."},{"tag":"p","t":"Implementation: Start with outpatient psychotherapy and a standardized assessment package; add group care, mindfulness and experiential modalities according to staffing and evidence; expand to TMS only with suitable medical oversight, equipment and regulatory compliance. Provide understandable patient progress reports emphasizing validated clinical outcomes, with EEG clearly labeled exploratory. Protect patient privacy, consent, data governance and equitable access. The long-term objective is a learning health system that improves individualized care through responsibly collected outcome data."},{"tag":"p","t":"Cross-diagnostic measures of therapeutic change — practical clinic framework (November 2026)"},{"tag":"p","t":"Core distinction: There is no established universal neural or physiological biomarker of mental health or therapeutic response. Measuring improvement across diagnoses is more feasible than identifying one biological mechanism shared by every successful treatment. Prioritize psychological flexibility and everyday functioning, with symptoms and patient-defined goals as complementary clinical outcomes."},{"tag":"p","t":"Psychological flexibility: The ability to adapt behavior to changing circumstances, make room for difficult thoughts and feelings, and pursue personally meaningful goals. It conceptually links mindfulness, decentering, ACT and adaptive self-referential processing. Candidate measures include the Multidimensional Psychological Flexibility Inventory (MPFI) or CompACT, repeated every two to four weeks. It is a promising transdiagnostic process, not a complete or universal definition of mental health."},{"tag":"p","t":"Functioning: Use the 12-item WHODAS 2.0 approximately monthly, supplemented by individualized goals, relationship and occupational functioning, and patient priorities. Improvement in daily life should carry more clinical weight than an isolated biomarker shift."},{"tag":"p","t":"Broad distress and symptoms: Track a cross-cutting symptom instrument where appropriate and disorder-specific measures such as PHQ-9 or GAD-7 weekly or biweekly. The research p-factor captures shared variance across psychopathology but is not a simple, established individual treatment-response test."},{"tag":"p","t":"Ecological monitoring: Brief smartphone check-ins can assess mood, negative self-referential thinking, avoidance, context and engagement in valued activities in daily life. Repeated sampling can complement retrospective questionnaires but should be designed to minimize burden."},{"tag":"p","t":"Physiological adjuncts: Resting heart-rate variability (for example RMSSD) is easier to collect repeatedly than EEG connectivity, but is affected by respiration, fitness, sleep, medication, illness and measurement conditions; it is not a universal mental-health marker. EEG connectivity and DMN-related network dynamics remain exploratory, not direct or validated readouts of individual recovery."},{"tag":"p","t":"Suggested outpatient dashboard: At baseline and periodically, summarize psychological flexibility, WHODAS functioning, symptom burden, patient-defined goals and optional rumination/cognitive tasks. Collect brief ecological assessments between visits. Display change over time and discuss it collaboratively. Only use EEG/HRV as supplementary measures with explicit uncertainty. Clinical decisions should be based on validated outcomes, safety, patient preference and clinical judgment, not a proprietary neural score."},{"tag":"p","t":"Research direction: Test whether candidate EEG or autonomic features add predictive value beyond symptoms, flexibility and functioning; separate associations with improvement from evidence that a marker can select the best treatment. Evaluate reliability, practice effects, confounding and external validation before using biomarkers for treatment allocation."}],[{"tag":"h2","t":"3. Philosophy, Contemplative Traditions & Utopian Futures"},{"tag":"p","t":"Central Question: What is humanity capable of becoming, and how can philosophical wisdom, contemplative practice, and technological progress guide us toward a flourishing civilization?"},{"tag":"h3","t":"3.1 Philosophical Foundations of the Good Life"},{"tag":"p","t":"- Aristotle's eudaimonia and virtue ethics"},{"tag":"p","t":"- Stoicism and psychological resilience"},{"tag":"p","t":"- Epicureanism and the pursuit of tranquility"},{"tag":"p","t":"- Existentialism, authenticity, and meaning"},{"tag":"p","t":"- Humanism and human potential"},{"tag":"p","t":"- Utilitarianism and the reduction of suffering"},{"tag":"p","t":"- Ethics of care and communal re g, and create a fulfilling life aligned with these principles?"},{"tag":"h3","t":"6.1 Developing a Unified Theory of Human Flourishing"},{"tag":"p","t":"- Integrating evolutionary anthropology with neuroscience"},{"tag":"p","t":"- Identifying universal versus culturally variable psychological needs"},{"tag":"p","t":"- Understanding suffering through biological, psychological, social, economic, and environmental systems"},{"tag":"p","t":"- Integrating contemplative philosophy with empirical psychology"},{"tag":"p","t":"- Developing a multidimensional framework for well-being"},{"tag":"p","t":"- Distinguishing individual pathology from systemic causes of distress"},{"tag":"p","t":"- Identifying modifiable mechanisms of psychological suffering"},{"tag":"p","t":"- Creating measurable indicators of flourishing"},{"tag":"h3","t":"6.2 Building an Integrative Treatment Model"},{"tag":"p","t":"- Humanistic and existential psychotherapy as a foundation"},{"tag":"p","t":"- Mindfulness and contemplative interventions"},{"tag":"p","t":"- Evidence-based psychotherapy"},{"tag":"p","t":"- Neuromodulation: TMS, tVNS, focused ultrasound, and neurofeedback"},{"tag":"p","t":"- Psychopharmacology and interdisciplinary psychiatric care"},{"tag":"p","t":"- Nutrition and lifestyle interventions"},{"tag":"p","t":"- Exercise, outdoor activity, and nature-based therapy"},{"tag":"p","t":"- Group psychotherapy and community support"},{"tag":"p","t":"- Trauma-informed care"},{"tag":"p","t":"- Spirituality and meaning-centered interventions"},{"tag":"p","t":"- Integrating biological and psychological outcome measures"},{"tag":"p","t":"- Personalizing treatment to individual needs and circumstances"},{"tag":"h3","t":"6.3 Creating an Integrative Treatment Clinic"},{"tag":"p","t":"- Designing a comprehensive clinical treatment program"},{"tag":"p","t":"- Combining individual therapy with community-based services"},{"tag":"p","t":"- Developing an interdisciplinary treatment team"},{"tag":"p","t":"- I
