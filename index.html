<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life HQ</title>
<style>
:root{--bg:#f4ece0;--card:#fffaf2;--ink:#3b2f27;--mut:#8a7766;--acc:#c0623a;--ok:#6b8f55;--line:#e2d3bf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1814;--card:#2a231d;--ink:#f0e4d4;--mut:#a89580;--acc:#e08a5c;--ok:#8fb577;--line:#41372d}}
:root[data-theme="dark"]{--bg:#1d1814;--card:#2a231d;--ink:#f0e4d4;--mut:#a89580;--acc:#e08a5c;--ok:#8fb577;--line:#41372d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
nav b{margin-right:auto;color:var(--acc);white-space:nowrap;align-self:center}
nav button,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:14px;max-width:1500px;margin:auto}.hide{display:none!important}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.cols{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 190px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:240px}
.col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.col.over{outline:2px dashed var(--acc)}
.task{display:flex;gap:6px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:grab}
.task span{flex:1;word-break:break-word}.task.done span{text-decoration:line-through;color:var(--mut)}
.task i{cursor:pointer;color:var(--mut);font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.habit{display:grid;grid-template-columns:130px repeat(31,22px);gap:4px;align-items:center;margin-bottom:6px;overflow-x:auto}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:none}
.dot.dim{visibility:hidden}.dot.on{border-color:transparent}
.hn{display:flex;gap:4px;align-items:center;cursor:pointer;font-weight:600}
.res{display:flex;gap:10px;flex-wrap:wrap}.res div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
#hs{position:relative;height:calc(100vh - 120px);min-height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.game-help{position:absolute;bottom:12px;left:12px;right:12px;display:grid;justify-items:start;gap:6px;pointer-events:none}.game-help>*{padding:6px 10px;border-radius:8px;background:#241d17e8;color:#fff5df;font-size:13px}.game-help strong:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#timer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:8}
#timer div{background:var(--card);padding:28px;border-radius:14px;text-align:center;max-width:320px}
#timer h1{font-size:48px;margin:6px 0}
small,.mut{color:var(--mut)}

#build-guide{width:min(640px,calc(100% - 24px));max-height:calc(100% - 32px);padding:22px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--card)}
#build-guide::backdrop{background:#1b1513b8}#build-guide a{color:var(--acc)}
.guide-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.guide-top h2{margin:2px 0 0}#build-guide h3{margin:16px 0 0}
#build-guide fieldset{margin:16px 0 0;border:1px solid var(--line);border-radius:8px}
#build-guide label{display:block;padding:5px 0;cursor:pointer}
.guide-feedback{color:var(--acc);min-height:1.4em;margin:6px 0}
.range-tool-photo{display:block;width:160px;max-width:100%;height:40px;object-fit:contain;margin:4px auto 0;background:#fff;border-radius:4px}

/* Morning HQ learning */
.learn-wrap{max-width:880px;margin:auto}.learn-hero{background:linear-gradient(125deg,#d8ad72,#ae6e43);color:#fff;border-radius:14px;padding:24px;margin-bottom:14px}.learn-hero h2{margin:5px 0}.learn-hero small{color:#fff}.learn-text{line-height:1.75;font-size:16px}.learn-text p{margin:0 0 14px}.learn-question{border-top:1px solid var(--line);padding:16px 0}.learn-choice{display:block;width:100%;text-align:left;white-space:normal;margin:7px 0}.learn-choice.selected{outline:2px solid var(--acc)}.learn-status{padding:10px;border-radius:8px;background:var(--bg);margin:12px 0}.learn-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.learn-links a{display:block;margin:9px 0;color:var(--acc);overflow-wrap:anywhere}

/* Survival equipment */
.gear-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gear-item{padding:16px;border:1px solid var(--line);border-radius:12px}.gear-visual{height:90px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d7c8a7,#9eaf94);border-radius:9px;margin-bottom:12px}.gear-visual svg{max-width:94%;height:70px}.gear-item p{line-height:1.6}.gear-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.gear-info{max-width:850px;line-height:1.75}.gear-info h3{margin-top:18px}

/* Daily reflection */
.ref-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.ref-field label{display:block;font-weight:650;margin-bottom:6px}.ref-field input,.ref-field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #a5a5a5;border-radius:8px;background:var(--bg);color:inherit}.ref-field textarea{min-height:80px}.ref-chart{width:100%;height:auto;max-height:430px;display:block}.ref-legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}.ref-legend span{display:inline-flex;align-items:center;gap:6px}.ref-dot{width:10px;height:10px;border-radius:50%;display:inline-block}.ref-tooltip{padding:12px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;line-height:1.5;min-height:55px}.ref-chart circle{cursor:pointer}.ref-chart circle:focus{stroke:#222;stroke-width:3}.ref-note{font-size:13px;opacity:.8}
</style></head><body>
<nav><b>Life HQ</b><button data-s="morning" class="on">Morning HQ</button><button data-s="dash">Dashboard</button><button data-s="habits">Habits</button><button data-s="home">Homestead</button><button data-s="gear">Equipment</button><button data-s="reflect">Daily Reflection</button><button data-s="prog">Progress</button></nav>
<main>
<section id="gear" class="hide"></section><section id="reflect" class="hide"></section><section id="morning"></section><section id="dash" class="hide"></section><section id="habits" class="hide"></section>
<section id="home" class="hide"><div id="hs"><canvas id="cv" tabindex="0" aria-label="Third-person homestead"></canvas><div class="hud" id="hud"></div><div class="game-help"><strong id="hint"></strong><span>WASD Walk · Drag Orbit · Scroll Zoom · Space Jump · E Interact · B Build · R Rotate · Left click Place</span></div></div></section>
<section id="prog" class="hide"></section>
</main><dialog id="build-guide" aria-labelledby="guide-title"></dialog><div id="toast"></div><div id="timer" class="hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLS=['Inbox','Next Actions','Scheduled','Projects','Waiting For','Someday/Maybe','Today'];
const COST={wall:{tires:4,earth:6},cistern:{tires:2,earth:4},panel:{tires:1,earth:3},battery:{tires:2,earth:3},greenhouse:{tires:3,earth:8},greywater:{tires:2,earth:5},farm:{tires:1,earth:5},compost:{tires:1,earth:3},rainbarrel:{tires:1,earth:3}},K='lifehq.v1';
const COLORS=['#c0623a','#6b8f55','#4f7ea8','#b58a2a'];
let S;
function fresh(){return{v:1,tasks:[],habits:[{id:'h1',name:'Meditate',color:COLORS[0]},{id:'h2',name:'Exercise',color:COLORS[1]},{id:'h3',name:'Study',color:COLORS[2]}],log:{},res:{tires:0,earth:0},walls:[],lessons:{},sim:{water:0,power:0},hist:[],odds:[70,20,8,2],month:new Date().toISOString().slice(0,7)}}
function load(){try{const j=localStorage.getItem(K);S=j?Object.assign(fresh(),JSON.parse(j)):fresh()}catch(e){S=fresh()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
load();
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1800)}
function reward(label,base){
  for(const k in base)S.res[k]=(S.res[k]||0)+base[k];
  let msg='+'+Object.entries(base).map(([k,v])=>v+' '+k).join(', '),r=Math.random()*100,[a,b,c]=S.odds,extra='';
  if(r>=a){if(r<a+b){S.res.tires++;extra=' · small bonus: +1 tire'}else if(r<a+b+c){S.res.earth+=3;S.res.tires++;extra=' · medium bonus: +3 earth, +1 tire'}else{S.res.tires+=3;S.res.earth+=5;extra=' · rare bonus: +3 tires, +5 earth'}}
  S.hist.unshift({t:Date.now(),label,msg:msg+extra});S.hist=S.hist.slice(0,50);toast(msg+extra);
}
/* ---------- Dashboard ---------- */
function dash(){
  const el=$('#dash'),open=S.tasks.filter(t=>!t.done&&t.col==='Today').slice(0,3);
  el.innerHTML=`<div class="bar"><input type="text" id="nt" placeholder="Capture a task (goes to Inbox)…"><button class="btn pri" id="add">Add</button><button class="btn pri" id="start">▶ START NEXT ACTION</button><button class="btn" id="just">JUST START (2 min)</button></div>
  ${campaignUI()}${bookCurriculumUI()}<div class="card"><b>Top Three Priorities</b> <small>(first three open tasks in Today)</small>${open.map((t,i)=>`<div>${i+1}. ${esc(t.t)}</div>`).join('')||'<div class="mut">Move tasks into Today.</div>'}</div>
  <div class="cols">${COLS.map(c=>`<div class="col" data-c="${c}"><h4>${c} · ${S.tasks.filter(t=>t.col===c&&!t.done).length}</h4>${S.tasks.filter(t=>t.col===c).map(t=>`<div class="task ${t.done?'done':''}" draggable="true" data-id="${t.id}"><input type="checkbox" ${t.done?'checked':''} data-chk="${t.id}"><span data-ed="${t.id}">${esc(t.t)}</span><i data-del="${t.id}" title="Delete">×</i></div>`).join('')}</div>`).join('')}</div>
  <small>Drag cards between columns. Double-click text to edit. Unchecking restores a task; a task only pays out once.</small>`;
  el.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>openBookChapter(Number(b.dataset.book)));
  const add=()=>{const v=$('#nt').value.trim();if(!v)return;S.tasks.push({id:'t'+Date.now(),t:v,col:'Inbox',done:false,paid:false});save();dash()};
  $('#add').onclick=add;$('#nt').onkeydown=e=>{if(e.key==='Enter')add()};
  $('#start').onclick=()=>{const t=S.tasks.find(t=>!t.done&&t.col==='Today')||S.tasks.find(t=>!t.done&&t.col==='Next Actions');t?focus(t,25*60,'Focus session'):toast('Add a task to Today or Next Actions first')};
  $('#just').onclick=()=>{const t=S.tasks.find(t=>!t.done&&t.col==='Today')||S.tasks.find(t=>!t.done);t?focus(t,120,'Just start: do only the tiniest first step'):toast('Add a task first')};
  el.querySelectorAll('.task').forEach(n=>n.ondragstart=e=>e.dataTransfer.setData('id',n.dataset.id));
  el.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();const t=S.tasks.find(t=>t.id===e.dataTransfer.getData('id'));if(t){t.col=c.dataset.c;save();dash()}}});
  el.querySelectorAll('[data-chk]').forEach(b=>b.onchange=()=>{const t=S.tasks.find(t=>t.id===b.dataset.chk);t.done=b.checked;if(t.done&&!t.paid){t.paid=true;reward('Task: '+t.t,{tires:2,earth:3})}save();dash()});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.del);save();dash()});
  el.querySelectorAll('[data-ed]').forEach(b=>b.ondblclick=()=>{const t=S.tasks.find(t=>t.id===b.dataset.ed),v=prompt('Edit task',t.t);if(v&&v.trim()){t.t=v.trim();save();dash()}});
}
function focus(t,secs,msg){
  const o=$('#timer');o.classList.remove('hide');let s=secs;
  const draw=()=>o.innerHTML=`<div><small>${msg}</small><h3>${esc(t.t)}</h3><h1>${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</h1><button class="btn" id="x">${s>0?'Stop':'Done'}</button></div>`;
  draw();const h=setInterval(()=>{if(--s<=0){s=0;clearInterval(h);toast('Nicely done. Keep going or stop, your call.')}draw();$('#x').onclick=end},1000);
  function end(){clearInterval(h);o.classList.add('hide')}$('#x').onclick=end;
}
/* ---------- Habits ---------- */
function habits(){
  const [y,m]=S.month.split('-').map(Number),days=new Date(y,m,0).getDate(),el=$('#habits');
  el.innerHTML=`<div class="bar"><button class="btn" id="pm">◀</button><b style="align-self:center">${new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="btn" id="nm">▶</button></div>
  <div class="card"><div class="habit"><span></span>${Array.from({length:31},(_,i)=>`<small style="text-align:center">${i<days?i+1:''}</small>`).join('')}</div>
  ${S.habits.map(h=>{const tot=Object.keys(S.log).filter(k=>k.startsWith(h.id+':')).length;return`<div class="habit"><div class="hn" data-h="${h.id}" title="Click to edit name and color">${esc(h.name)}<small>(${tot})</small></div>${Array.from({length:31},(_,i)=>{const d=i+1,k=`${h.id}:${S.month}-${String(d).padStart(2,'0')}`,on=S.log[k];return`<button class="dot ${i>=days?'dim':''} ${on?'on':''}" style="${on?'background:'+h.color:''}" data-k="${k}"></button>`}).join('')}</div>`}).join('')}</div>
  <small>Missed days carry no penalty; totals in brackets are lifetime completions. Each day earns +1 earth the first time it’s checked.</small>`;
  const shift=n=>{const d=new Date(y,m-1+n,1);S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');save();habits()};
  $('#pm').onclick=()=>shift(-1);$('#nm').onclick=()=>shift(1);
  el.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(S.log[k])delete S.log[k];else{S.log[k]=1;S.paidH=S.paidH||{};if(!S.paidH[k]){S.paidH[k]=1;reward('Habit',{earth:1})}}save();habits()});
  el.querySelectorAll('.hn').forEach(n=>n.onclick=()=>{const h=S.habits.find(h=>h.id===n.dataset.h),v=prompt('Habit name',h.name);if(v&&v.trim())h.name=v.trim();const c=prompt('Color (hex, or 1-4 for presets)',h.color);if(c)h.color=/^[1-4]$/.test(c)?COLORS[c-1]:c;save();habits()});
}
/* ---------- Progress ---------- */
function prog(){
  const done=S.tasks.filter(t=>t.done).length,c=t=>S.walls.filter(w=>w.t===t).length,n=S.walls.filter(w=>!w.t||w.t==='wall').length,lvl=(S.sim.stable||0)>=600?'Level 7: Self-Sufficient Homestead':c('greenhouse')&&c('greywater')&&c('cistern')&&c('panel')&&c('battery')&&n&&S.res.food>0?'Level 6: Integrated Homestead (started)':c('greenhouse')&&S.res.food>0?'Level 5: Food Production (started)':c('panel')&&c('battery')?'Level 4: Energy Independence (started)':c('cistern')?'Level 3: Water Independence (started)':n>=1?'Level 2: Shelter (in progress)':'Level 1: Empty Land';
  $('#prog').innerHTML=`<div class="card"><b>${lvl}</b><div class="mut">${done} tasks completed · ${Object.keys(S.log).length} habit days · ${n} wall sections · stable ${Math.min(600,Math.floor(S.sim.stable||0))}/600 s</div></div>
  <div class="card"><b>Bonus odds</b> <small>(transparent, adjustable, never paid or escalating; set all but “none” to 0 to turn bonuses off)</small><div class="bar" style="margin-top:8px">${['None','Small','Medium','Rare'].map((l,i)=>`<label>${l} % <input type="number" min="0" max="100" value="${S.odds[i]}" data-o="${i}" style="width:60px"></label>`).join('')}</div></div>
  <div class="card"><b>Recent rewards</b>${S.hist.slice(0,12).map(h=>`<div><small>${new Date(h.t).toLocaleTimeString()}</small> ${esc(h.label)} <span class="mut">${esc(h.msg)}</span></div>`).join('')||'<div class="mut">Nothing yet.</div>'}</div>
  <div class="bar"><button class="btn" id="ex">Export backup</button><button class="btn" id="im">Import backup</button><button class="btn" id="rs">Reset everything</button></div>
  <small>Educational game only: simplified, not real construction guidance.</small>`;
  document.querySelectorAll('[data-o]').forEach(i=>i.onchange=()=>{const v=S.odds.slice();v[i.dataset.o]=+i.value;const [,a,b,c]=v;if(a+b+c>100){toast('Bonus odds can’t exceed 100%');prog();return}v[0]=100-a-b-c;S.odds=v;save();prog()});
  $('#ex').onclick=()=>{const t=JSON.stringify(S);navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Backup copied to clipboard'),()=>prompt('Copy your backup',t))};
  $('#im').onclick=()=>{const t=prompt('Paste backup JSON');if(!t)return;try{const next=Object.assign(fresh(),JSON.parse(t));if(!Array.isArray(next.walls))throw new Error('Invalid structures');S=next;save();if(G)restoreParts();show('prog');toast('Imported')}catch(e){toast('Invalid backup')}};
  $('#rs').onclick=()=>{if(confirm('Erase all Life HQ data?')){S=fresh();save();location.reload()}};
}
/* ---------- Homestead (3D) ---------- */
let G=null,build=false,rot=0,selection='wall';
const PART_LABEL={wall:'Wall',cistern:'Cistern',panel:'Solar panel',battery:'Battery',greenhouse:'Greenhouse',greywater:'Greywater bed'};
// Increment a guide's version when its required reading or checks change.
const GUIDES = {
  wall: {version:1, sources:[
    ['Earthship Biotecture tire wall method','https://earthship.com/2018/09/13/how-to-pound-tires-and-build-tire-walls/'],
    ['Earthship Academy and hands-on training','https://earthship.com/learn/']
  ], sections:[
    ['Plan the wall','Decide whether the wall carries a roof, retains earth, or acts as a freestanding partition. Draw the roof-to-foundation load path, openings, and finish thickness. Ask the building department how it reviews alternative materials and have a structural designer specify the footing, allowable soil, bonding, reinforcement and roof connections. For a bermed wall, design drainage and waterproofing before placing the first tire.',
      'What needs to be designed before building a bermed wall?', ['Only the interior finish','Structure, waterproofing and drainage','Only the height of each tire'],1],
    ['Make and lay a test course','Stage sound tires sorted by size, suitable fill, a shovel, sledge, level, string line and eye and hand protection. On a prepared level base, center a tire on the layout, shovel soil into the tire and pound it outward into the sidewall cavity. Add soil and repeat until the cavity is packed and the top stays level. Check the test unit against the approved compaction and dimension criteria. Work from the first course upward, offsetting joints and checking each unit against the line before starting the next course.',
      'Where should the soil be compacted during tire filling?', ['Only on the flat top','Only in the central opening','Throughout the tire, including under its sidewalls'],2],
    ['Tie in, protect and inspect','Build opening frames, roof bearing and the top bond or tie detail from the approved drawings. Schedule inspections while connections are visible. Pack voids and finish exposed faces using specified compatible materials. Inspect below-grade waterproofing, protection and drainage before backfilling. Check for water intrusion after storms and investigate movement or recurring cracks.',
      'When should you inspect the drainage and waterproofing?', ['Before backfill hides them','After planting the berm','Only if plaster cracks'],0]
  ]},
  cistern: {version:1,sources:[
    ['EPA rainwater harvesting design examples','https://www.epa.gov/system/files/documents/2022-04/green-infrastructure-toolbox_rainwater-harvesting.pdf']
  ],sections:[
    ['Size the catchment and tank','Decide what the water will supply and confirm local collection and plumbing requirements. Estimate gross gallons from roof area in square feet × rain in inches × 0.623, then reduce for actual losses. For example, 500 square feet in a one-inch storm yields about 312 gallons before losses. Compare monthly rainfall and demand, especially through dry spells, before picking a rated tank.',
      'What does the roof-area calculation estimate?', ['The daily demand','The storm yield before losses','The required pump pressure'],1],
    ['Assemble the water path','Draw the route from roof to gutter, downspout, debris screen, first-flush diversion and opaque covered tank. Use the tank manufacturer’s base and anchorage details for a full tank. Provide screened vents and inlets, a cleanout, a draw-off, and a screened overflow that leads to an approved discharge away from the foundation. Keep the nonpotable plumbing separate and labeled.',
      'Where should the overflow discharge?', ['Into the footing trench','Into a drinking-water pipe','To an approved outlet away from the foundation'],2],
    ['Test and maintain','Test inflow and overflow with clean water before relying on rain. Check the base for settlement and fittings for leaks. Clean gutters, screens and first-flush equipment regularly and follow the manufacturer’s tank service instructions. For drinking water, work with the health authority on treatment, testing and plumbing protection.',
      'What should you test before the first storm?', ['Both inflow and overflow','Only the tank lid','Only the faucet color'],0]
  ]},
  panel: {version:1,sources:[
    ['U.S. Department of Energy guide to going solar','https://www.energy.gov/cmei/systems/articles/walk-me-through-it-step-step-guide-consumers-going-solar'],
    ['U.S. Department of Energy permitting and inspection','https://www.energy.gov/cmei/systems/permitting-and-inspection-rooftop-solar']
  ],sections:[

function selectTool(id){

    save();hud();toast('Restocked to 10 .22 LR rounds');
    return;
  }
  equipped=equipped===id?null:id;

function toolClick(ray){
  if(!guidePassed(equipped))return;
  const p=G.player.body.position;
  if(equipped==='popper'){
    if(Math.hypot(p.x-RANGE.x,p.z-RANGE.padZ)>1.8){toast('Stand on the blue pad in the northeast corner');return}
    if(!guidePassed('rounds')||!rangeStats().rounds){toast('Unlock or restock .22 LR rounds in Tools');return}
    const stats=rangeStats(), hit=ray.intersectObjects(G.rangeTarget)[0];
    stats.rounds--;stats.shots++;
    fireGameRifle(hit);
    if(hit)stats.hits++;
    S.range=stats;
    save();hud();
    toast(hit?(hit.object===G.bullseye?'Bullseye!':'Target hit!'):'Miss');
    return;
  }
  const point=ray.intersectObject(G.gr)[0]?.point;
  if(!point)return;
  if(equipped==='tape'){
    if(firstMark){
      toast(`Horizontal span: ${firstMark.distanceTo(point).toFixed(2)} m`);
      firstMark=null;
    }else{
      firstMark=point.clone();
      toast('First point set. Click the second point.');
    }
    return;
  }
  if(Math.hypot(point.x-DIG.x,point.z-DIG.z)>1.1||Math.hypot(p.x-DIG.x,p.z-DIG.z)>3){
    toast('Stand near the soil patch by spawn and click it');
    return;
  }
  if(S.dugPatch){toast('This patch has already been dug');return}
  S.dugPatch=true;
  S.res.earth+=2;
  G.digPatch.material.color.setHex(0x554433);
  save();hud();toast('Collected 2 earth');
}
function makeToolStations(){
  const {x,z,padZ}=RANGE, scene=G.sc;
  G.digPatch=block(scene,S.dugPatch?0x554433:0x895d3f,DIG.x,.02,DIG.z,1.65,.045,1.65);
  block(scene,0x53849b,x,.025,padZ,3.2,.05,3.2);
  block(scene,0x684834,x,1.2,z-.14,.19,2.4,.32);
  G.rangeTarget=[];
  for(const [radius,offset,color] of [[.85,0,0xf0d6a5],[.61,.028,0xd17456],[.37,.056,0xf0d6a5],[.17,.084,0x3f878b]]){
    const face=new THREE.Mesh(new THREE.CircleGeometry(radius,32),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));
    face.position.set(x,1.65,z+offset);
    scene.add(face);
    G.rangeTarget.push(face);
    G.bullseye=face;
  }
  for(let i=0;i<13;i++)block(scene,0x668e9a,17+i*.75,.015,5-i*1.92,.44,.025,.65);
}
function toolHint(){
  if(equipped==='tape')return 'Tape measure · Click two ground points';
  if(equipped==='shovel')return 'Shovel · Click the soil patch near spawn';
  if(equipped==='popper')return 'Ruger 10/22 · Follow blue markers to the pad · Click the target';
  return '';
}

const BOOK_CHAPTERS={
 1:{source:[['Earthship Biotecture — preparation','https://earthship.com/preparation-to-the-earthship-academy/'],['Dry Creek Earthship construction journal','https://drycreekearthship.wordpress.com/construction-process/']],
 sections:[
 ['What makes an Earthship different','An Earthship is a building approach that combines passive solar design, thermal mass, rainwater harvesting, renewable energy, food-growing spaces and on-site wastewater systems. The systems are interconnected: a greenhouse can contribute to solar heat gain, but glazing can also cause overheating; rainwater collection reduces dependence on utilities, but stored water still requires monitoring and treatment. A building does not become self-sufficient merely by adding solar panels. It must balance resource demand, storage capacity, climate, maintenance and occupant behavior.'],
 ['Thermal mass versus insulation','Thermal mass stores sensible heat and changes temperature relatively slowly. Dense earth-filled walls can buffer daily temperature swings, but they are not interchangeable with insulation. Insulation reduces the rate of heat flow; thermal mass delays and redistributes it. The useful combination depends on local climate, soil temperatures, solar exposure, moisture control and building geometry. A wall that performs well in a sunny high-desert setting may behave differently in a humid or persistently cloudy region.'],
 ['The sun as a design input','Solar orientation influences winter heat gain, summer overheating, daylight and photovoltaic production. In the northern hemisphere, equator-facing glazing often captures more low-angle winter sunlight, but the best design depends on the site. Shade from trees, mountains and neighboring buildings changes through the day and year. A good site study records seasonal sun paths, prevailing winds, drainage patterns and existing vegetation before a footprint is finalized.'],
 ['The six-system mindset','Think of the house as six interacting systems: shelter and thermal comfort; electricity; water capture and storage; water treatment and reuse; sanitation; and food production. For each system, list inputs, outputs, storage, failure points and maintenance tasks. For example, electricity has generation, conversion, batteries, loads and backup; water has collection, screening, storage, treatment, distribution and overflow. A design can fail when any one link is neglected.'],
 ['Embodied materials and durability','Reused tires, bottles and cans can divert materials from waste streams, but sustainability also depends on transportation, labor, structural suitability, moisture resistance and eventual repairs. Compare local availability and the full life cycle of materials rather than assuming that recycled automatically means low impact. Roof membranes, pumps, batteries, filters and sealants have service lives and require replacement plans.'],
 ['Planning your build sequence','A useful sequence is: investigate the site; establish climate and resource needs; design the building and utility systems together; validate structure, drainage and permits; prepare the site; build the envelope; install water and electrical infrastructure; test and commission; then monitor performance. This is a planning framework, not a universal construction recipe. Earthships vary widely in layout, wall design and systems.'],

  };

  };

  cv.onpointerdown=e=>{

  const movement=['KeyW','KeyA','KeyS','KeyD'];

function movePlayer(dt) {
  const {player,keys,solids,th}=G, p=player.body.position;
  const forward=Number(keys.has('KeyW'))-Number(keys.has('KeyS'));
  const side=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));
  const speed=3.6/Math.max(1,Math.hypot(forward,side));
  const dx=(side*Math.cos(th)-forward*Math.sin(th))*speed*dt;
  const dz=(-side*Math.sin(th)-forward*Math.cos(th))*speed*dt;
  // Resolve one axis at a time so the player can slide along obstacles.
  const oldX=p.x,oldZ=p.z;
  const x=clamp(p.x+dx,-44,44),z=clamp(p.z+dz,-44,44);
  if(!overlaps(bodyBounds(x,p.y,p.z),solids))p.x=x;
  if(!overlaps(bodyBounds(p.x,p.y,z),solids))p.z=z;
  if(dx||dz)player.body.rotation.y=Math.atan2(dx,dz);
  player.vy-=14*dt;
  let y=Math.max(0,p.y+player.vy*dt);
  player.grounded=y===0;
  for(const box of solids){
    if(p.x+PLAYER_RADIUS<box.min.x||p.x-PLAYER_RADIUS>box.max.x||
      p.z+PLAYER_RADIUS<box.min.z||p.z-PLAYER_RADIUS>box.max.z)continue;
    if(player.vy<0&&p.y>=box.max.y&&y<=box.max.y){
      y=box.max.y+.0001;player.grounded=true;
    }
    if(player.vy>0&&p.y+1.85<=box.min.y&&y+1.85>=box.min.y){
      y=box.min.y-1.8501;player.vy=0;
    }
  }
  p.y=y;
  if(player.grounded)player.vy=0;
  const distance=Math.hypot(p.x-oldX,p.z-oldZ);
  player.stride+=distance*5;
  const swing=distance&&player.grounded?Math.sin(player.stride)*.55:0;
  player.limbs.forEach(({arm,leg},i)=>{
    leg.rotation.x=i?swing:-swing;
    arm.rotation.x=-leg.rotation.x*.75;
  });
}
function followPlayer() {
  const {cam,player,target,offset,cameraRay,hit,solids,th,ph,d}=G;
  target.copy(player.body.position);
  target.y+=1.39;
  offset.set(Math.sin(th)*Math.cos(ph),Math.sin(ph),Math.cos(th)*Math.cos(ph));
  cameraRay.set(target,offset);
  let distance=d;
  for(const box of solids){
    if(cameraRay.intersectBox(box,hit))distance=Math.min(distance,Math.max(.18,hit.distanceTo(target)-.2));
  }
  if(offset.y<0)distance=Math.min(distance,(target.y-.22)/-offset.y);
  cam.position.copy(target).addScaledVector(offset,distance);
  cam.lookAt(target);
  cam.updateMatrixWorld();
  player.body.visible=distance>.48;
  $('#hint').textContent=nearDoor()?(G.door.open?'E Close door':'E Open door'):toolHint();
}

function simStep(h){const n=Date.now(),dt=lastT?Math.min(2,(n-lastT)/1000):0;lastT=n;
  const c=t=>S.walls.filter(w=>w.t===t).length,sh=S.walls.some(w=>!w.t||w.t==='wall'),sm=S.sim,wc=c('cistern')*30,bc=c('battery')*20;
  if(rain<=0&&Math.random()<dt/60)rain=8;
  if(rain>0){rain-=dt;if(sh)sm.water+=dt*2*.8}
  sm.water=Math.max(0,Math.min(wc,sm.water-(sh?dt*.05*(c('greywater')?.4:1):0)));   // a greywater bed treats and returns ~60% of household use
  sm.power=Math.max(0,Math.min(bc,sm.power+(c('panel')*Math.max(0,h)*.6-(sh?.15:0))*dt));
  const gh=c('greenhouse');sm.crop=sm.crop||0;   // crops need water + power; growth just pauses without them

  const all=['wall','cistern','panel','battery','greenhouse','greywater'].every(t=>t==='wall'?sh:c(t)>0);

  const rd=sm.crop>=100;if(rd!==wasR){wasR=rd;hud()}

  simTxt=`💧 ${sm.water.toFixed(0)}/${wc} · ⚡ ${sm.power.toFixed(0)}/${bc}${rain>0?' · 🌧 rain':''}${sh&&bc&&sm.power<1?' · household dark':''}${gh?` · 🌱 ${sm.crop.toFixed(0)}%`:''}`}

 el.innerHTML='<div class="learn-wrap"><div class="learn-hero"><small>HOMESTEAD / EQUIPMENT</small><h2>Survival equipment shop & encyclopedia</h2><p>Earn earth through Life HQ activities. Spend it on simplified virtual equipment and ammunition. No real-world purchases.</p></div><div class="card"><b>Available earth: '+S.res.earth+'</b> · Training targets hit: '+g.targets+' · Shots fired: '+g.shots+'<p><small>All actions below are fictional arcade-style interactions; they do not model actual ballistics.</small></p></div><div class="gear-grid">'+GEAR.map(x=>{let owned=g.owned.includes(x.id),loaded=g.loaded[x.id]||0,stock=g.ammo[x.id]||0;return '<div class="gear-item"><div class="gear-visual">'+gearShape(x.kind)+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.intro)+'</p><div><b>'+esc(x.ammo)+'</b> · Magazine: '+loaded+' / '+x.mag+' · Inventory: '+stock+'</div><div class="gear-btns"><button class="btn" data-buy="'+x.id+'" '+(owned||S.res.earth<x.price?'disabled':'')+'>'+(owned?'Owned':'Buy · '+x.price+' earth')+'</button><button class="btn" data-ammo="'+x.id+'" '+(!owned||S.res.earth<x.ammoPrice?'disabled':'')+'>Buy '+esc(x.ammo)+' · '+x.ammoPrice+' earth</button><button class="btn" data-equip="'+x.id+'" '+(!owned?'disabled':'')+'>'+(g.equipped===x.id?'Equipped':'Equip')+'</button><button class="btn" data-detail="'+x.id+'">Learn more</button></div></div>'}).join('')+'</div><div class="card"><h3>Practice range</h3><p>Equipped: '+esc(GEAR.find(x=>x.id===g.equipped)?.name||'None')+'</p><div class="gear-btns"><button class="btn" id="gear-reload">Reload</button><button class="btn pri" id="gear-fire">Fire at virtual target</button></div><p id="gear-feedback" aria-live="polite">Equip an item, buy ammunition, and reload to begin.</p></div><div class="card gear-info" id="gear-detail"><h3>Learning encyclopedia</h3><p>Select “Learn more” for an in-depth overview of each item and whether it is actually necessary for a self-sufficient homestead.</p></div></div>';
 el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let x=GEAR.find(z=>z.id===b.dataset.buy);if(g.owned.includes(x.id)||S.res.earth<x.price)return;S.res.earth-=x.price;g.owned.push(x.id);save();gearPage()});
 el.querySelectorAll('[data-ammo]').forEach(b=>b.onclick=()=>{let x=GEAR.find(z=>z.id===b.dataset.ammo);if(!g.owned.includes(x.id)||S.res.earth<x.ammoPrice)return;S.res.earth-=x.ammoPrice;g.ammo[x.id]=(g.ammo[x.id]||0)+x.mag;save();gearPage()});
 el.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{g.equipped=b.dataset.equip;save();gearPage()});
 el.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let x=GEAR.find(z=>z.id===b.dataset.detail);$('#gear-detail').innerHTML='<h2>'+esc(x.name)+'</h2><div class="gear-visual">'+gearShape(x.kind)+'</div><h3>What it is</h3><p>'+esc(x.intro)+'</p><h3>Is it necessary for a homestead?</h3><p>'+esc(x.role)+'</p><h3>Limitations, responsibilities, and safety</h3><p>'+esc(x.limits)+'</p><h3>Alternatives and priorities</h3><p>'+esc(x.alt)+'</p><h3>Real-world considerations</h3><p>Before considering any real equipment, review local laws, safe storage requirements, training options, land-use rules, and wildlife management guidance. The game economy is fictional; it does not represent market prices or purchasing advice.</p>';$('#gear-detail').scrollIntoView({behavior:'smooth',block:'start'})});
 $('#gear-reload').onclick=()=>{let x=GEAR.find(z=>z.id===g.equipped);if(!x)return toast('Equip an item first');let n=Math.min(x.mag-(g.loaded[x.id]||0),g.ammo[x.id]||0);if(n<=0)return toast('Buy ammunition or magazine already full');g.loaded[x.id]=(g.loaded[x.id]||0)+n;g.ammo[x.id]-=n;save();gearPage();toast('Reloaded '+n)};
 $('#gear-fire').onclick=()=>{let x=GEAR.find(z=>z.id===g.equipped);if(!x)return toast('Equip an item first');if(!(g.loaded[x.id]>0))return toast('Reload first');g.loaded[x.id]--;g.shots++;if(Math.random()<0.65)g.targets++;save();gearPage();$('#gear-feedback').textContent='Virtual shot registered. Practice target updated.'};
}



/* Public read-only Google Sheet sync. The owner must enable public access in Google Sheets. */
const REF_PUBLIC_CSV='https://docs.google.com/spreadsheets/d/1HxQRl6cWPYjb50flMfWpo2zrGfP8OQVt0VL-27tAbRA/gviz/tq?tqx=out:csv&sheet=Sheet1';
function parseRefCSV(csv){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<csv.length;i++){const c=csv[i];if(quote){if(c==='"'&&csv[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\\n'||c==='\\r'){if(c==='\\r'&&csv[i+1]==='\\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function refISO(v){const t=String(v||'').trim();if(/^\\d{4}-\\d{2}-\\d{2}/.test(t))return t.slice(0,10);const d=new Date(t);if(!Number.isNaN(d.getTime()))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return null}
function sheetToRef(csv){const table=parseRefCSV(csv),headers=table[0]||[],find=regex=>table.findIndex(r=>regex.test(String(r[1]||'').trim()));const index={emotional:find(/^Emotional$/i),mental:find(/^Mental\\s*$/i),physical:find(/^Physical\\s*$/i),spiritual:find(/^Spiritual\\s*$/i),diet:find(/^Diet:/i),wakeTime:find(/^What time did you wake/i),sleepHours:find(/^How many hours of sleep/i),substances:find(/^What substances/i),journal:find(/^Free Response:/i)};for(const k of ['emotional','mental','physical','spiritual'])index[k+'Note']=index[k]+1;const output=[];for(let c=2;c<headers.length;c++){const date=refISO(headers[c]);if(!date)continue;const v={date};let found=false;for(const[k]of REF_DOMAINS){const raw=table[index[k]]?.[c];const n=Number(raw);if(raw!==undefined&&raw!==''&&Number.isInteger(n)&&n>=1&&n<=10){v[k]=n;found=true}v[k+'Note']=table[index[k+'Note']]?.[c]||''}for(const k of ['diet','wakeTime','sleepHours','substances','journal'])v[k]=table[index[k]]?.[c]||'';if(found)output.push(v)}return output}
let refRemote=[],refSyncStatus='Not connected',refLastFetch=0;
async function syncRefSheet(force=false){if(!force&&Date.now()-refLastFetch<120000)return;refLastFetch=Date.now();refSyncStatus='Loading Google Sheet…';try{const res=await fetch(REF_PUBLIC_CSV,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const csv=await res.text();if(csv.trim().startsWith('<'))throw Error('Google sign-in or sharing required');refRemote=sheetToRef(csv);refSyncStatus='Google Sheet connected · '+refRemote.length+' dated entries';}catch(e){refSyncStatus='Sheet unavailable: enable Anyone with the link → Viewer (or Publish to web). Local entries remain available.'}if($('#reflect')&&!$('#reflect').classList.contains('hide'))reflect()}
function refMerged(){const map=new Map(refRemote.map(r=>[r.date,r]));for(const r of reflectionData())map.set(r.date,{...map.get(r.date),...r});return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}

/* ---------- Daily Reflection ---------- */
const REF_DOMAINS=[['emotional','Emotional','#dc7868'],['mental','Mental','#538cba'],['physical','Physical','#61a279'],['spiritual','Spiritual','#aa82c4']];
const REF_SHEET='https://docs.google.com/spreadsheets/d/1HxQRl6cWPYjb50flMfWpo2zrGfP8OQVt0VL-27tAbRA/edit';
function reflectionData(){if(!Array.isArray(S.reflections))S.reflections=[];return S.reflections}
function refToday(){return localDay()}
function refDetails(r){return 'Date: '+r.date+'\n'+REF_DOMAINS.map(([k,n])=>n+': '+(r[k]??'—')+'/10'+(r[k+'Note']?' — '+r[k+'Note']:'' )).join('\n')+'\nSleep: '+(r.sleepHours||'Not recorded')+' hours; wake: '+(r.wakeTime||'Not recorded')+'\nDiet: '+(r.diet||'Not recorded')+'\nSubstances: '+(r.substances||'Not recorded')+'\nJournal: '+(r.journal||'No entry');}
function refChart(rows){
 const W=760,H=330,L=48,R=18,T=22,B=48,iw=W-L-R,ih=H-T-B;
 const dates=rows.map(r=>r.date),min=0,max=10;
 const x=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1)),y=v=>T+ih-(Number(v)-min)*ih/(max-min);
 let parts=['<svg class="ref-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Four-domain reflection scores over time. Focus or hover on dots for daily notes.">'];
 for(let v=0;v<=10;v+=2){parts.push('<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'" stroke="currentColor" opacity=".13"/><text x="'+(L-12)+'" y="'+(y(v)+4)+'" font-size="12" text-anchor="end" fill="currentColor">'+v+'</text>')}
 const step=Math.max(1,Math.ceil(rows.length/7));dates.forEach((d,i)=>{if(i%step===0||i===rows.length-1)parts.push('<text x="'+x(i)+'" y="'+(H-18)+'" font-size="11" text-anchor="middle" fill="currentColor">'+esc(d.slice(5))+'</text>')});
 REF_DOMAINS.forEach(([key,name,color])=>{const points=rows.map((r,i)=>({i,v:Number(r[key])})).filter(p=>Number.isFinite(p.v)&&p.v>=1&&p.v<=10);if(points.length)parts.push('<polyline fill="none" stroke="'+color+'" stroke-width="3" points="'+points.map(p=>x(p.i)+','+y(p.v)).join(' ')+'"/>');points.forEach(p=>parts.push('<circle tabindex="0" role="button" aria-label="'+esc(name)+' '+p.v+' on '+rows[p.i].date+'" data-ref="'+p.i+'" cx="'+x(p.i)+'" cy="'+y(p.v)+'" r="6" fill="'+color+'" stroke="white" stroke-width="1.5"><title>'+esc(name)+' '+p.v+' — '+rows[p.i].date+'</title></circle>'))});
 parts.push('<text x="'+W/2+'" y="'+(H-2)+'" text-anchor="middle" font-size="12" fill="currentColor">Date</text></svg>');return parts.join('');
}
function reflect(){
 const el=$('#reflect'),rows=refMerged(),today=refToday(),r=rows.find(z=>z.date===today)||{date:today};
 const fields=REF_DOMAINS.map(([k,n])=>'<div class="ref-field"><label for="ref-'+k+'">'+n+' health (1–10)</label><input id="ref-'+k+'" type="number" min="1" max="10" step="1" value="'+(r[k]??'')+'" required></div><div class="ref-field"><label for="ref-'+k+'Note">'+n+' explanation</label><textarea id="ref-'+k+'Note">'+esc(r[k+'Note']||'')+'</textarea></div>').join('');
 el.innerHTML='<div class="learn-wrap"><div class="learn-hero"><small>LIFE HQ / REFLECTION</small><h2>Daily Reflection</h2><p>Track how you feel and what happened, then explore patterns over time.</p></div><div class="card"><h2>Your health over time</h2><div class="ref-legend">'+REF_DOMAINS.map(([k,n,c])=>'<span><i class="ref-dot" style="background:'+c+'"></i>'+n+'</span>').join('')+'</div>'+(rows.length?refChart(rows):'<p>No entries yet. Complete today’s reflection to start your graph.</p>')+'<div class="ref-tooltip" id="ref-detail" aria-live="polite">Hover, focus, or click any data point to see that day’s full reflection.</div><p class="ref-note">Correlations are exploratory; changes in sleep, diet, or substances do not establish causes.</p></div><div class="card"><h2>Today’s check-in · '+today+'</h2><form id="ref-form"><div class="ref-form">'+fields+'<div class="ref-field"><label for="ref-sleepHours">Hours slept</label><input id="ref-sleepHours" type="number" min="0" max="24" step=".25" value="'+esc(r.sleepHours||'')+'"></div><div class="ref-field"><label for="ref-wakeTime">Wake-up time</label><input id="ref-wakeTime" type="text" value="'+esc(r.wakeTime||'')+'" placeholder="e.g. 7:30 AM"></div><div class="ref-field"><label for="ref-diet">Food and drink (amounts)</label><textarea id="ref-diet">'+esc(r.diet||'')+'</textarea></div><div class="ref-field"><label for="ref-substances">Substances, medications, caffeine (amounts)</label><textarea id="ref-substances">'+esc(r.substances||'')+'</textarea></div></div><div class="ref-field"><label for="ref-journal">Free response — what else mattered today?</label><textarea id="ref-journal">'+esc(r.journal||'')+'</textarea></div><div class="learn-actions"><button class="btn pri" type="submit">Save today’s reflection</button><button class="btn" type="button" id="ref-export">Export reflections (JSON)</button><button class="btn" type="button" id="ref-import">Import JSON</button><input type="file" accept=".json,application/json" id="ref-file" style="display:none"></div></form><p class="ref-note">New entries save locally; the public Google Sheet is read-only. Existing sheet entries load automatically when public sharing is enabled. Import/export provides a backup; avoid using shared devices for private journal entries.</p><p><a href="'+REF_SHEET+'" target="_blank" rel="noopener noreferrer">Open existing Nightly Checkin spreadsheet</a></p></div></div>';
 el.querySelectorAll('[data-ref]').forEach(dot=>{const fn=()=>{$('#ref-detail').textContent=refDetails(rows[Number(dot.dataset.ref)])};dot.addEventListener('mouseenter',fn);dot.addEventListener('focus',fn);dot.addEventListener('click',fn)});
 $('#ref-form').onsubmit=e=>{e.preventDefault();let v={date:today};for(const[k]of REF_DOMAINS){let n=Number($('#ref-'+k).value);if(!Number.isInteger(n)||n<1||n>10)return toast('Each health score must be 1–10');v[k]=n;v[k+'Note']=$('#ref-'+k+'Note').value}for(const k of ['sleepHours','wakeTime','diet','substances','journal'])v[k]=$('#ref-'+k).value;if(v.sleepHours!==''&&(!Number.isFinite(Number(v.sleepHours))||Number(v.sleepHours)<0||Number(v.sleepHours)>24))return toast('Sleep hours must be 0–24');const all=reflectionData(),i=all.findIndex(z=>z.date===today);if(i>=0)all[i]=v;else all.push(v);save();reflect();toast('Reflection saved')};
 $('#ref-refresh').onclick=()=>syncRefSheet(true);
 $('#ref-export').onclick=()=>{const data=JSON.stringify({type:'lifehq-reflections',version:1,entries:reflectionData()},null,2);const blob=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='lifehq-reflections.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
 $('#ref-import').onclick=()=>$('#ref-file').click();
 $('#ref-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(j.type!=='lifehq-reflections'||!Array.isArray(j.entries))throw Error('Wrong format');const all=reflectionData();for(const row of j.entries){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(row.date)||!REF_DOMAINS.every(([k])=>Number.isInteger(Number(row[k]))&&Number(row[k])>=1&&Number(row[k])<=10))continue;const clean={date:row.date};for(const[k]of REF_DOMAINS){clean[k]=Number(row[k]);clean[k+'Note']=String(row[k+'Note']||'').slice(0,20000)}for(const k of ['sleepHours','wakeTime','diet','substances','journal'])clean[k]=String(row[k]||'').slice(0,20000);const i=all.findIndex(z=>z.date===row.date);if(i<0)all.push(clean);else all[i]=clean}save();reflect();toast('Imported reflections')}catch(err){toast('Invalid reflection JSON')}};
}

/* ---------- nav ---------- */
function show(s){['morning','dash','habits','home','gear','reflect','prog'].forEach(x=>$('#'+x).classList.toggle('hide',x!==s));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  if(s==='reflect'){reflect();syncRefSheet()}if(s==='gear')gearPage();if(s==='morning')morning();if(s==='dash')dash();if(s==='habits')habits();if(s==='prog')prog();
  if(s==='home'){if(!G)initGL();else{fit();hud()}$('#cv').focus({preventScroll:true})}else G?.keys.clear()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));
show('morning');
</script></body></html>
